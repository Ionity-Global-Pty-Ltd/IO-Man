  // PAWN* Oxen Sovereign Realm: paint an endless-plains key art procedurally
  function paintPawnArt() {
    const c = document.createElement('canvas'); c.width = 1280; c.height = 720; const x = c.getContext('2d');
    const sky = x.createLinearGradient(0, 0, 0, 420); sky.addColorStop(0, '#1b2d5a'); sky.addColorStop(.6, '#5b8ed6'); sky.addColorStop(1, '#f3c27a'); x.fillStyle = sky; x.fillRect(0, 0, 1280, 720);

    const mountains = (y, col, amp, f) => { x.fillStyle = col; x.beginPath(); x.moveTo(0, 720); for (let i = 0; i <= 1280; i += 8) x.lineTo(i, y - Math.abs(Math.sin(i * f) * amp + Math.sin(i * f * 2.7) * amp * .35)); x.lineTo(1280, 720); x.closePath(); x.fill(); };
    mountains(400, '#5b6b7e', 110, .006); mountains(430, '#46593f', 70, .011); mountains(470, '#3f6a2e', 40, .02);
    const ground = x.createLinearGradient(0, 470, 0, 720); ground.addColorStop(0, '#5f9a3a'); ground.addColorStop(1, '#2f4d24'); x.fillStyle = ground; x.fillRect(0, 470, 1280, 250);
    x.fillStyle = '#7a5433'; x.beginPath(); x.ellipse(640, 540, 330, 46, 0, 0, 6.3); x.fill();
    for (let i = 0; i < 70; i++) { const gx = Math.random() * 1280, gy = 480 + Math.random() * 240; x.strokeStyle = 'rgba(120,190,70,.8)'; x.lineWidth = 2; x.beginPath(); x.moveTo(gx, gy); x.lineTo(gx + (Math.random() - .5) * 8, gy - 10 - Math.random() * 14); x.stroke(); }
    x.fillStyle = '#5c3a21'; x.fillRect(624, 330, 32, 220); x.fillStyle = '#f59e0b'; x.shadowColor = '#f59e0b'; x.shadowBlur = 22; x.fillRect(560, 360, 160, 16); x.beginPath(); x.moveTo(600, 330); x.lineTo(626, 300); x.lineTo(626, 330); x.fill(); x.beginPath(); x.moveTo(680, 330); x.lineTo(654, 300); x.lineTo(654, 330); x.fill();
    x.fillStyle = '#00f0ff'; x.shadowColor = '#00f0ff'; x.shadowBlur = 30; x.beginPath(); x.moveTo(640, 580); x.lineTo(668, 620); x.lineTo(640, 660); x.lineTo(612, 620); x.closePath(); x.fill(); x.shadowBlur = 0;
    x.font = '900 230px serif'; x.textAlign = 'center'; x.fillStyle = 'rgba(255,255,255,.92)'; x.shadowColor = '#000'; x.shadowBlur = 30; x.fillText('🐂', 300, 640); x.shadowBlur = 0;
        return c.toDataURL('image/jpeg', .85);
  }
  function paintChessArt() {

    const g = x.createRadialGradient(640, 420, 40, 640, 420, 700); g.addColorStop(0, 'rgba(0,240,255,.22)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, 1280, 720);
    x.save(); x.translate(640, 440); x.transform(1, 0, 0, .5, 0, 0); x.rotate(.78);
    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) { x.fillStyle = (i + j) % 2 ? '#0f172a' : '#e2e8f0'; x.fillRect((i - 4) * 70, (j - 4) * 70, 70, 70); }
    x.strokeStyle = '#00f0ff'; x.lineWidth = 6; x.shadowColor = '#00f0ff'; x.shadowBlur = 30; x.strokeRect(-290, -290, 580, 580); x.restore();
    x.font = '900 260px serif'; x.textAlign = 'center'; x.fillStyle = '#f8fafc'; x.shadowColor = '#00f0ff'; x.shadowBlur = 50; x.fillText('♔', 470, 470); x.fillStyle = '#0f172a'; x.shadowColor = '#f59e0b'; x.fillText('♛', 810, 430); x.shadowBlur = 0;
        return c.toDataURL('image/jpeg', .85);
  }

  const sfx = {
    on: true, ctx: null,
    init() { if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); return !!this.ctx; },
    tone(f0, f1, d, v, type = 'sine') {
      if (!this.on || !this.init()) return;
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .02);
    },
    tick() { this.tone(880, 1320, .07, .04, 'triangle'); },
    launch() { this.tone(220, 880, .5, .08, 'sawtooth'); setTimeout(() => this.tone(660, 1760, .35, .05, 'triangle'), 120); }
  };
  try { sfx.on = localStorage.getItem('ionity.fun.sound') !== 'off'; } catch (e) {}
  const sndIcon = document.getElementById('sndIcon');
  sndIcon.textContent = sfx.on ? 'volume_up' : 'volume_off';
  document.getElementById('sndBtn').addEventListener('click', () => {
    sfx.on = !sfx.on; sndIcon.textContent = sfx.on ? 'volume_up' : 'volume_off';
    try { localStorage.setItem('ionity.fun.sound', sfx.on ? 'on' : 'off'); } catch (e) {}
    sfx.tick();
  });

  // ---------------- Build UI ----------------
  const bg = document.getElementById('bg'), shelf = document.getElementById('shelf'), hero = document.getElementById('hero');
  const layers = {}, tiles = [];
  let idx = -1;
  GAMES.forEach((gm, i) => {
    if (!gm.art) gm.art = gm.id === 'chess' ? paintChessArt() : paintPawnArt();
    const L = document.createElement('div'); L.className = 'layer'; L.style.backgroundImage = `url("${gm.art}")`; bg.appendChild(L); layers[gm.id] = L;
    const t = document.createElement('button');
    t.className = 'tile'; t.setAttribute('role', 'option'); t.style.backgroundImage = `url("${gm.art}")`; t.style.setProperty('--tc', gm.color);
    t.innerHTML = `<span class="glint"></span><span class="tk">${gm.key}</span>${gm.badge ? `<span class="tb">${gm.badge}</span>` : ''}<span class="tn">${gm.title}</span>`;
    t.addEventListener('mouseenter', () => focusGame(i));
    t.addEventListener('click', () => (i === idx ? launch() : focusGame(i)));
    shelf.appendChild(t); tiles.push(t);
  });

  function render(gm) {
    document.documentElement.style.setProperty('--c', gm.color);
    document.getElementById('hNum').textContent = String(GAMES.indexOf(gm) + 1).padStart(2, '0');
    document.getElementById('hTag').textContent = gm.tag;
    document.getElementById('hTitle').innerHTML = `${gm.title}<small>${gm.sub}</small>`;
    document.getElementById('hLine').textContent = gm.line;
    document.getElementById('hChips').innerHTML = gm.chips.map(([ic, tx]) => `<span class="chip"><span class="ms">${ic}</span>${tx}</span>`).join('');
    document.getElementById('hMeta').innerHTML = `<span><b>${gm.ver}</b></span><span>${gm.players}</span><span>FREE</span>`;
    document.getElementById('playBtn').innerHTML = `<span class="ms">${gm.icon || 'play_arrow'}</span>${gm.action || 'PLAY'}<span class="pb">A</span>`;
  }
  let swapTimer = null;
  function focusGame(i, silent) {
    i = (i + GAMES.length) % GAMES.length;
    if (i === idx) return;
    idx = i;
    const gm = GAMES[idx];
    tiles.forEach((t, k) => { t.classList.toggle('focus', k === idx); t.setAttribute('aria-selected', k === idx); });
    Object.entries(layers).forEach(([id, L]) => L.classList.toggle('on', id === gm.id));
    document.documentElement.style.setProperty('--c', gm.color);
    if (silent) { render(gm); }
    else {
      hero.classList.add('swap');
      clearTimeout(swapTimer);
      swapTimer = setTimeout(() => { render(gm); hero.classList.remove('swap'); }, 160);
      sfx.tick();
    }
    tiles[idx].scrollIntoView({ behavior: silent ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
    try { localStorage.setItem('ionity.fun.lastGame', idx); } catch (e) {}
  }

  // ---------------- Launch ----------------
  let launching = false;
  function launch() {
    if (launching || idx < 0) return;
    launching = true;
    const gm = GAMES[idx];
    document.getElementById('launchTitle').textContent = gm.title;
    document.getElementById('launch').classList.add('go');
    sfx.launch();
    setTimeout(() => { location.href = gm.href; }, 850);
  }
  addEventListener('pageshow', () => { launching = false; document.getElementById('launch').classList.remove('go'); });
  document.getElementById('playBtn').addEventListener('click', launch);

  // ---------------- Keyboard ----------------
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { focusGame(idx + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { focusGame(idx - 1); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === ' ') { launch(); e.preventDefault(); }
    else { const g = GAMES.findIndex(x => x.key === e.key); if (g >= 0) { focusGame(g); setTimeout(launch, 250); } }
  });

  // ---------------- Gamepad ----------------
  const padIcon = document.getElementById('padIcon');
  const prev = {}; let rep = { dir: 0, t: 0 }, last = performance.now();
  addEventListener('gamepaddisconnected', () => padIcon.classList.remove('live'));
  (function poll(now) {
    const dt = (now - last) / 1000; last = now;
    const gp = navigator.getGamepads ? [...navigator.getGamepads()].find(p => p && p.connected) : null;
    if (gp) {
      padIcon.classList.add('live');
      const press = i => { const p = !!(gp.buttons[i] && gp.buttons[i].pressed); const edge = p && !prev[i]; prev[i] = p; return edge; };
      if (press(0) | press(9)) launch();
      if (press(15) | press(5)) focusGame(idx + 1);
      if (press(14) | press(4)) focusGame(idx - 1);
      const ax = gp.axes[0] || 0, dir = ax > .55 ? 1 : ax < -.55 ? -1 : 0;
      if (dir && dir !== rep.dir) { rep = { dir, t: .35 }; focusGame(idx + dir); }
      else if (dir && (rep.t -= dt) <= 0) { rep.t = .18; focusGame(idx + dir); }
      else if (!dir) rep.dir = 0;
    }
    requestAnimationFrame(poll);
  })(performance.now());

  // ---------------- Clock ----------------
  const clock = document.getElementById('clock');
  const tickClock = () => { clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); };
  tickClock(); setInterval(tickClock, 15000);

  // ---------------- Boot ----------------
  let start = 0;
  try { const s = parseInt(localStorage.getItem('ionity.fun.lastGame'), 10); if (s >= 0 && s < GAMES.length) start = s; } catch (e) {}
  focusGame(start, true);
</script>
</body>
