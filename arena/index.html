<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!--

      Games: Wizard's Chess + Wizard's Checkers (English draughts)

      Author: Johan Wilhelm van Antwerp | Ionity (Pty) Ltd | AEDI

    <style>
        :root {
            --bg: #07090f; --panel: rgba(10, 14, 24, 0.72); --line: rgba(255, 255, 255, 0.09);
            --gold: #fbbf24; --gold2: #f59e0b; --cyan: #00f0ff; --cyan2: #38bdf8;
            --violet: #a855f7; --red: #f43f5e; --txt: #e8eef7; --dim: #7d8aa3;
            --pa: #22c55e; --pb: #ef4444; --px: #3b82f6; --py: #eab308;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: var(--bg); color: var(--txt);
            font-family: 'Rajdhani', 'Segoe UI', sans-serif; font-weight: 600;
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
        }
        #canvas-container { position: fixed; inset: 0; z-index: 1; }
        canvas { display: block; width: 100%; height: 100%; outline: none; }
        .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }

        /* Screen FX: vignette + faint scanlines */
        .fx-vignette { position: fixed; inset: 0; z-index: 2; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%); }
        .fx-scan { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0.35;
            background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0,240,255,0.025) 3px 4px); }

        /* ---------- HUD ---------- */
        #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 14px 16px; transition: opacity .4s; }
        #hud.off { opacity: 0; }
        .hud-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .hud-left, .hud-right { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
        .glass { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 10px 30px rgba(0,0,0,.45); }

        .logo-chip { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; text-decoration: none;
            border: 1px solid rgba(251,191,36,.45); background: linear-gradient(145deg, rgba(251,191,36,.18), rgba(7,9,15,.9) 55%, rgba(0,240,255,.16));
            box-shadow: 0 0 18px rgba(251,191,36,.25); transition: transform .2s; }
        .logo-chip:hover { transform: scale(1.06); }
        .logo-chip svg { width: 30px; height: 30px; }

        .seg { display: flex; padding: 4px; border-radius: 16px; gap: 4px; }
        .seg-btn { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 12px;
            font-size: 22px; color: var(--dim); transition: all .2s; position: relative; }
        .seg-btn .k { font-family: 'Orbitron'; font-size: 9px; letter-spacing: .08em; padding: 2px 5px; border-radius: 5px; border: 1px solid currentColor; opacity: .7; }
        .seg-btn.active { color: #fff7dd; background: linear-gradient(135deg, rgba(251,191,36,.35), rgba(0,240,255,.18)); box-shadow: inset 0 0 0 1px rgba(251,191,36,.6), 0 0 16px rgba(251,191,36,.3); }
        .seg-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,.06); }

        /* Versus plates */
        .versus { display: flex; align-items: center; gap: 10px; pointer-events: auto; margin: 0 auto; }
        .plate { display: flex; align-items: center; gap: 10px; min-width: 150px; height: 56px; padding: 0 14px; border-radius: 18px; transition: all .3s; opacity: .55; transform: scale(.94); }
        .plate.b { flex-direction: row-reverse; }
        .plate.active { opacity: 1; transform: scale(1); }
        .plate.w.active { box-shadow: 0 0 0 1px rgba(255,255,255,.5), 0 0 26px rgba(255,255,255,.18); }
        .plate.b.active { box-shadow: 0 0 0 1px rgba(168,85,247,.7), 0 0 26px rgba(168,85,247,.3); }
        .orb { width: 26px; height: 26px; border-radius: 50%; flex: none; }
        .plate.w .orb { background: radial-gradient(circle at 35% 30%, #fff, #d9d2c3 60%, #8f8778); box-shadow: 0 0 12px rgba(255,255,255,.55); }
        .plate.b .orb { background: radial-gradient(circle at 35% 30%, #8b5cf6, #1b1430 60%, #07050d); box-shadow: 0 0 12px rgba(168,85,247,.7); }
        .plate.active .orb { animation: orbPulse 1.6s ease-in-out infinite; }
        @keyframes orbPulse { 50% { transform: scale(1.15); } }
        .pinfo { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .plate.b .pinfo { align-items: flex-end; }
        .pname { font-family: 'Orbitron'; font-size: 13px; font-weight: 800; letter-spacing: .14em; }
        .plate.b .pname { color: #d8b4fe; }
        .spoils { font-size: 16px; line-height: 1; height: 17px; white-space: nowrap; overflow: hidden; max-width: 140px; letter-spacing: -1px; }
        .plate.w .spoils { color: #c4b5fd; }
        .plate.b .spoils { color: #fde68a; }
        .dots { display: none; gap: 3px; }
        .plate.thinking .dots { display: inline-flex; }
        .dots i { width: 5px; height: 5px; border-radius: 50%; background: #d8b4fe; animation: dot 1s infinite; }
        .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
        @keyframes dot { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
        .vs-col { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; }
        .vs-txt { font-family: 'Orbitron'; font-weight: 900; font-size: 15px; color: var(--gold); text-shadow: 0 0 10px rgba(251,191,36,.6); letter-spacing: .1em; }
        .chip { font-family: 'Orbitron'; font-size: 9px; font-weight: 800; letter-spacing: .12em; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
        .chip.red { color: #fecdd3; background: rgba(244,63,94,.25); box-shadow: 0 0 0 1px rgba(244,63,94,.6), 0 0 14px rgba(244,63,94,.45); animation: chipPulse 1.2s infinite; }
        .chip.amber { color: #fef3c7; background: rgba(245,158,11,.25); box-shadow: 0 0 0 1px rgba(245,158,11,.6); }
        .chip.hidden { visibility: hidden; }
        @keyframes chipPulse { 50% { box-shadow: 0 0 0 1px rgba(244,63,94,.9), 0 0 22px rgba(244,63,94,.8); } }

        /* Round console buttons */
        .rbtn { all: unset; cursor: pointer; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: #cbd5e1; position: relative; transition: all .18s; }
        .rbtn:hover:not(:disabled) { color: #fff; background: rgba(255,255,255,.1); transform: translateY(-1px); }
        .rbtn:active:not(:disabled) { transform: scale(.92); }
        .rbtn:disabled { opacity: .3; cursor: default; }
        .rbtn.on { color: var(--cyan); }
        .rbtn.hot { color: #1a1206; background: linear-gradient(135deg, var(--gold), var(--gold2)); box-shadow: 0 0 18px rgba(251,191,36,.55); animation: hot 2.4s infinite; }
        @keyframes hot { 50% { box-shadow: 0 0 28px rgba(251,191,36,.85); } }
        .rbtn[data-tip]:hover::after { content: attr(data-tip); position: absolute; top: 48px; left: 50%; transform: translateX(-50%); white-space: nowrap;
            font-family: 'Orbitron'; font-size: 9px; letter-spacing: .12em; padding: 4px 7px; border-radius: 6px; background: rgba(0,0,0,.85); color: #fff; pointer-events: none; }
        .btn-row { display: flex; gap: 2px; padding: 4px; border-radius: 26px; }

        /* Bottom legend */
        .legend { align-self: center; display: flex; align-items: center; gap: 16px; padding: 8px 16px; border-radius: 999px; font-size: 13px; letter-spacing: .12em; color: #b9c4d6; pointer-events: auto; }
        .legend span { display: inline-flex; align-items: center; gap: 6px; }
        .pb { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-family: 'Orbitron'; font-size: 10px; font-weight: 900; color: #0b0d13; }
        .pb.a { background: var(--pa); } .pb.b { background: var(--pb); } .pb.x { background: var(--px); } .pb.y { background: var(--py); }
        .kc { font-family: 'Orbitron'; font-size: 9px; font-weight: 800; padding: 3px 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,.35); color: #fff; }

        /* Telemetry: big console callouts */
        #combat-telemetry { position: fixed; left: 50%; top: 40%; z-index: 20; pointer-events: none; text-align: center; opacity: 0; transform: translate(-50%, -50%) scale(.6); transition: opacity .2s, transform .25s cubic-bezier(.2,1.6,.4,1); }
        #combat-telemetry.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        #telemetry-title { font-family: 'Orbitron'; font-weight: 900; font-size: clamp(38px, 9vw, 96px); letter-spacing: .06em; color: #fff;
            -webkit-text-stroke: 2px rgba(251,191,36,.9); text-shadow: 0 0 22px rgba(251,191,36,.75), 0 0 60px rgba(0,240,255,.35); font-style: italic; }
        #telemetry-subtitle { font-family: 'Orbitron'; font-size: 12px; letter-spacing: .4em; color: var(--cyan); margin-top: 2px; }
        #combat-telemetry.small #telemetry-title { font-size: 22px; -webkit-text-stroke: 0; font-style: normal; letter-spacing: .3em; text-shadow: 0 0 12px rgba(0,240,255,.8); }
        #combat-telemetry.small { top: 76%; }

        /* ---------- Title / pause menu ---------- */
        #title-screen { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
            background: radial-gradient(ellipse at center, rgba(7,9,15,.35), rgba(7,9,15,.88) 75%); transition: opacity .45s; }
        #title-screen.off { opacity: 0; pointer-events: none; }
        .t-logo { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .t-logo svg { width: 74px; height: 74px; filter: drop-shadow(0 0 18px rgba(251,191,36,.6)); }
        .t-name { font-family: 'Orbitron'; font-weight: 900; font-size: clamp(30px, 7vw, 68px); letter-spacing: .14em; line-height: 1;
            background: linear-gradient(180deg, #fff 20%, #fde68a 60%, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 0 22px rgba(251,191,36,.45)); }
        .t-sub { font-family: 'Orbitron'; font-size: 11px; letter-spacing: .6em; color: var(--cyan); }
        .tiles { display: flex; gap: 18px; }
        .tile { all: unset; cursor: pointer; width: clamp(130px, 30vw, 190px); aspect-ratio: 4/5; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
            background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.01)); border: 1px solid var(--line); transition: all .25s cubic-bezier(.2,1.2,.4,1); position: relative; }
        .tile .g { font-size: clamp(64px, 14vw, 96px); line-height: 1; color: #e5e7eb; transition: all .25s; }
        .tile .n { font-family: 'Orbitron'; font-size: 13px; font-weight: 800; letter-spacing: .3em; color: var(--dim); }
        .tile.focus { transform: translateY(-8px) scale(1.06); border-color: rgba(251,191,36,.8); background: linear-gradient(160deg, rgba(251,191,36,.22), rgba(0,240,255,.06));
            box-shadow: 0 0 0 1px rgba(251,191,36,.6), 0 0 40px rgba(251,191,36,.35), 0 30px 60px rgba(0,0,0,.6); }
        .tile.focus .g { color: #fff; text-shadow: 0 0 24px rgba(251,191,36,.9); }
        .tile.focus .n { color: #fde68a; }
        .tile .cur { position: absolute; top: 10px; right: 12px; font-family: 'Orbitron'; font-size: 8px; letter-spacing: .15em; color: var(--cyan); display: none; }
        .tile.current .cur { display: block; }
        .t-mode { display: flex; gap: 6px; padding: 4px; border-radius: 999px; }
        .t-mode button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 999px; font-family: 'Orbitron'; font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--dim); }
        .t-mode button.active { color: #07090f; background: var(--cyan); box-shadow: 0 0 16px rgba(0,240,255,.5); }
        .press { font-family: 'Orbitron'; font-size: 12px; letter-spacing: .4em; color: #fff; animation: blink 1.4s infinite; display: flex; align-items: center; gap: 10px; }
        @keyframes blink { 50% { opacity: .25; } }
        .t-foot { position: absolute; bottom: 16px; font-size: 11px; letter-spacing: .2em; color: #5b6578; text-align: center; }
        .t-foot a { color: #7dd3fc; text-decoration: none; }

        /* ---------- Modals ---------- */
        #modal-overlay { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(3,5,10,.62); backdrop-filter: blur(4px); }
        #modal-overlay.open { display: flex; }
        .card { padding: 26px 28px; border-radius: 28px; text-align: center; min-width: min(92vw, 360px); }
        .card h2 { margin: 0 0 18px; font-family: 'Orbitron'; font-weight: 900; letter-spacing: .2em; font-size: 20px; color: #fde68a; }
        .promo-row { display: flex; gap: 10px; justify-content: center; }
        .promo-btn { all: unset; cursor: pointer; width: 64px; height: 72px; border-radius: 18px; display: grid; place-items: center; font-size: 40px; background: rgba(255,255,255,.05); border: 1px solid var(--line); transition: all .2s; }
        .promo-btn.focus, .promo-btn:hover { background: rgba(251,191,36,.2); border-color: rgba(251,191,36,.8); transform: translateY(-4px); box-shadow: 0 0 20px rgba(251,191,36,.4); }
        #gameover-card .big { font-family: 'Orbitron'; font-weight: 900; font-style: italic; font-size: clamp(34px, 8vw, 56px); letter-spacing: .06em; color: #fff;
            -webkit-text-stroke: 1.5px rgba(251,191,36,.9); text-shadow: 0 0 26px rgba(251,191,36,.7); margin: 4px 0 10px; }
        .winner { display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Orbitron'; font-size: 13px; letter-spacing: .3em; color: #cbd5e1; margin-bottom: 22px; }
        .winner .orb { width: 20px; height: 20px; }
        .winner .orb.w { background: radial-gradient(circle at 35% 30%, #fff, #d9d2c3 60%, #8f8778); }
        .winner .orb.b { background: radial-gradient(circle at 35% 30%, #8b5cf6, #1b1430 60%, #07050d); }
        .winner .orb.d { background: linear-gradient(90deg, #e5e7eb 50%, #4c1d95 50%); }
        .go-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .go-btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 14px; font-family: 'Orbitron'; font-size: 11px; font-weight: 800; letter-spacing: .14em;
            border: 1px solid var(--line); background: rgba(255,255,255,.05); color: #e2e8f0; }
        .go-btn.primary { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #1a1206; border-color: transparent; box-shadow: 0 0 20px rgba(251,191,36,.45); }
        .go-btn:hover { filter: brightness(1.12); }

        @media (max-width: 760px) {
            #hud { padding: 10px; }
            .versus { order: 3; width: 100%; justify-content: center; }
            .plate { min-width: 0; height: 48px; padding: 0 10px; }
            .spoils { max-width: 90px; font-size: 14px; }
            .rbtn { width: 36px; height: 36px; } .rbtn .ms { font-size: 20px; }
            .legend { font-size: 11px; gap: 10px; }
            .seg-btn .k { display: none; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="fx-vignette"></div>
    <div class="fx-scan"></div>

    <!-- ===================== HUD ===================== -->
    <div id="hud" class="off">
        <div class="hud-top">
            <div class="hud-left">
                <a class="logo-chip" href="/games/" title="ionity.fun">
                    <svg viewBox="0 0 64 64" fill="none"><polygon points="32,4 58,18 58,46 32,60 6,46 6,18" stroke="#fbbf24" stroke-width="3" fill="rgba(15,23,42,0.85)"/><path d="M18 22L32 48L46 22" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 22L32 37L40 22" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="13" r="3" fill="#fbbf24"/></svg>
                </a>
                <div class="seg glass" id="game-switch">
                    <button class="seg-btn game-tab active" data-game="chess" title="Chess"><span class="k">L1</span>♚</button>
                    <button class="seg-btn game-tab" data-game="checkers" title="Checkers">⛂<span class="k">R1</span></button>
                </div>
            </div>

            <div class="versus">
                <div class="plate w glass active" id="plate-w">
                    <div class="orb"></div>
                    <div class="pinfo"><span class="pname">P1</span><div class="spoils" id="captured-by-white"></div></div>
                </div>
                <div class="vs-col"><span class="vs-txt">VS</span><span id="status-chip" class="chip hidden">CHECK</span></div>
                <div class="plate b glass" id="plate-b">
                    <div class="orb"></div>
                    <div class="pinfo"><span class="pname"><span class="dots"><i></i><i></i><i></i></span> <span id="p2-label">CPU</span></span><div class="spoils" id="captured-by-black"></div></div>
                </div>
            </div>

            <div class="hud-right">
                <div class="btn-row glass">
                    <button id="btn-demo" class="rbtn hot" data-tip="DEMO"><span class="ms">bolt</span></button>
                    <button id="btn-actioncam" class="rbtn on" data-tip="IMPACT CAM"><span class="ms" id="actioncam-icon">videocam</span></button>
                    <button id="btn-camera" class="rbtn" data-tip="CAMERA"><span class="ms">cameraswitch</span></button>
                    <button id="btn-mode" class="rbtn" data-tip="1P / 2P"><span class="ms" id="mode-icon">smart_toy</span></button>
                    <button id="btn-undo" class="rbtn" data-tip="UNDO" disabled><span class="ms">undo</span></button>
                    <button id="btn-sound" class="rbtn" data-tip="SOUND"><span class="ms" id="sound-icon">volume_up</span></button>
                    <button id="btn-new" class="rbtn" data-tip="RESTART"><span class="ms">restart_alt</span></button>
                    <button id="btn-menu" class="rbtn" data-tip="MENU"><span class="ms">menu</span></button>
                </div>
            </div>
        </div>

        <div class="legend glass" id="legend"></div>
    </div>

    <!-- Big callouts -->
    <div id="combat-telemetry"><div id="telemetry-title">K.O.</div><div id="telemetry-subtitle"></div></div>

    <!-- ===================== TITLE / PAUSE MENU ===================== -->
    <div id="title-screen">
        <div class="t-logo">
            <svg viewBox="0 0 64 64" fill="none"><polygon points="32,4 58,18 58,46 32,60 6,46 6,18" stroke="#fbbf24" stroke-width="3" fill="rgba(15,23,42,0.85)"/><path d="M18 22L32 48L46 22" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 22L32 37L40 22" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="13" r="3" fill="#fbbf24"/></svg>
            <div class="t-name">WIZARD'S ARENA</div>
            <div class="t-sub">VBLOCKS · IONITY.FUN</div>
        </div>
        <div class="tiles">
            <button class="tile focus" data-game="chess"><span class="cur">● ACTIVE</span><span class="g">♚</span><span class="n">CHESS</span></button>
            <button class="tile" data-game="checkers"><span class="cur">● ACTIVE</span><span class="g">⛂</span><span class="n">CHECKERS</span></button>
        </div>
        <div class="t-mode glass" id="t-mode">
            <button data-ai="1" class="active"><span class="ms" style="font-size:16px">smart_toy</span>1P · CPU</button>
            <button data-ai="0"><span class="ms" style="font-size:16px">group</span>2P</button>
        </div>
        <div class="press" id="press-hint"><span class="pb a">A</span> / <span class="kc">ENTER</span> START</div>
        <div class="t-foot">© 2018–2026 Ionity (Pty) Ltd · <a href="/games/">IONITY.FUN</a> · <a href="https://www.ionity.today" target="_blank" rel="noopener">IONITY.TODAY</a></div>
    </div>

        // Native Web Audio cathedral acoustics (no external audio library):
        // stone slides, two-stage knock-down strike + ground-slam fracture, arcane chimes.
        class SoundEngine {
            constructor() { this.ctx = null; this.enabled = true; this.master = null; }
            init() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return false;
                    this.ctx = new AC();
                    this.master = this.ctx.createGain();
                    this.master.gain.value = 0.9;
                    // Simple cathedral reverb: feedback delay network
                    const dry = this.ctx.createGain(); dry.gain.value = 1;
                    const wet = this.ctx.createGain(); wet.gain.value = 0.28;
                    const d1 = this.ctx.createDelay(); d1.delayTime.value = 0.083;
                    const d2 = this.ctx.createDelay(); d2.delayTime.value = 0.127;
                    const fb = this.ctx.createGain(); fb.gain.value = 0.55;
                    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
                    this.master.connect(dry); dry.connect(this.ctx.destination);
                    this.master.connect(d1); d1.connect(d2); d2.connect(lp); lp.connect(fb); fb.connect(d1);
                    lp.connect(wet); wet.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
                return true;
            }
            _ok() { return this.enabled && this.init(); }
            _tone(type, f0, f1, dur, vol, delay = 0) {
                const now = this.ctx.currentTime + delay;
                const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                o.type = type;
                o.frequency.setValueAtTime(f0, now);
                o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), now + dur);
                g.gain.setValueAtTime(vol, now);
                g.gain.exponentialRampToValueAtTime(0.001, now + dur);
                o.connect(g); g.connect(this.master);
                o.start(now); o.stop(now + dur + 0.02);
            }
            _noise(dur, freq, q, vol, delay = 0, decayShape = 0.4) {
                const now = this.ctx.currentTime + delay;
                const n = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
                const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (n * decayShape));
                const src = this.ctx.createBufferSource(); src.buffer = buf;
                const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
                const g = this.ctx.createGain(); g.gain.setValueAtTime(vol, now);
                g.gain.exponentialRampToValueAtTime(0.001, now + dur);
                src.connect(f); f.connect(g); g.connect(this.master);
                src.start(now);
            }
            _chime(freqs, dur = 0.9, vol = 0.06, stagger = 0.06) {
                freqs.forEach((f, i) => this._tone('triangle', f, f * 0.999, dur, vol, i * stagger));
            }
            playSelect() { if (!this._ok()) return; this._tone('sine', 520, 780, 0.16, 0.08); }
            // Heavy stone scraping slide + settle thud
            playMove(isHeavy = false) {
                if (!this._ok()) return;
                this._noise(isHeavy ? 0.45 : 0.36, isHeavy ? 150 : 200, 3.2, 0.16, 0, 0.9);
                this._tone('triangle', isHeavy ? 95 : 115, 38, 0.16, 0.24, isHeavy ? 0.4 : 0.32);
            }
            // Stage 1: kinetic strike — sub-bass punch + stone crack transient
            playKnockdownHit() {
                if (!this._ok()) return;
                this._tone('sawtooth', 150, 32, 0.3, 0.32);
                this._tone('square', 920, 180, 0.1, 0.14);
            }
            // Stage 2: toppled monolith slams the board and fractures into chunks
            playGroundSlamAndShatter() {
                if (!this._ok()) return;
                this._tone('sine', 95, 22, 0.5, 0.5);
                [0, 0.04, 0.09, 0.16, 0.24, 0.34].forEach((off, i) =>
                    this._noise(0.12 + Math.random() * 0.1, 500 + i * 260 + Math.random() * 300, 2, 0.26 / (1 + i * 0.25), off));
            }
            playCheck() { if (!this._ok()) return; this._chime([440, 659, 880], 1.0, 0.07, 0.03); }
            playCrown() { if (!this._ok()) return; this._chime([523, 659, 784, 1047], 1.2, 0.06, 0.08); }
        }

            update(dt = 0.016) {
                this.targetPhi = Math.max(0.18, Math.min(Math.PI / 2.15, this.targetPhi));
                this.targetRadius = Math.max(10, Math.min(36, this.targetRadius));
                this.theta += (this.targetTheta - this.theta) * 0.08;
                this.phi += (this.targetPhi - this.phi) * 0.08;
                this.radius += (this.targetRadius - this.radius) * 0.08;
                this.lookAtTarget.lerp(this.desiredLookAt, 0.1);
                let sx = 0, sy = 0, sz = 0;
                if (this.shakeIntensity > 0.005) {
                    sx = (Math.random() - 0.5) * this.shakeIntensity;
                    sy = (Math.random() - 0.5) * this.shakeIntensity;
                    sz = (Math.random() - 0.5) * this.shakeIntensity;
                    this.shakeIntensity *= Math.pow(0.04, dt);
                } else { this.shakeIntensity = 0; }
                camera.position.x = this.radius * Math.sin(this.phi) * Math.sin(this.theta) + sx;
                camera.position.y = this.radius * Math.cos(this.phi) + sy;
                camera.position.z = this.radius * Math.sin(this.phi) * Math.cos(this.theta) + sz;
                camera.lookAt(this.lookAtTarget);

            roseGroup.add(new THREE.Mesh(new THREE.CircleGeometry(6.5, 32),

            for (let s = 0; s < 12; s++) {
                const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.22, 13, 0.25), stoneMat);
                spoke.rotation.z = (s * Math.PI) / 12;
                roseGroup.add(spoke);
            }
            const roseGlow = new THREE.Mesh(new THREE.TorusGeometry(6.4, 0.12, 8, 48), neonMat);
            roseGroup.add(roseGlow);
            cathedralGroup.add(roseGroup);

            // VBLOCKS // IONITY GLOBAL banners flanking the rose window
            const bannerMat = new THREE.MeshBasicMaterial({ map: createCathedralBannerTexture(), side: THREE.DoubleSide });
            [-11, 11].forEach(bx => {
                const banner = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 8.4), bannerMat);
                banner.position.set(bx, 10.5, -30);
                cathedralGroup.add(banner);
            });
            scene.add(cathedralGroup);
        }
        buildGothicCathedral();

        const dustCount = 160;
        const dustGeo = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustCount; i++) {
            dustPositions[i * 3] = (Math.random() - 0.5) * 32;
            dustPositions[i * 3 + 1] = Math.random() * 16;
            dustPositions[i * 3 + 2] = (Math.random() - 0.5) * 32;
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        scene.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xfcd34d, size: 0.09, transparent: true, opacity: 0.45 })));

        /***********************************************************************
         * 4. BOARD, MATERIALS & PIECE GEOMETRY
         ***********************************************************************/
        const TILE_SIZE = 1.15;
        const BOARD_OFFSET = (7 * TILE_SIZE) / 2;
        const FILES = 'abcdefgh';

        const marbleTex = createMarbleTexture(false);
        const obsidianTex = createObsidianTexture(false);
        const boardLightTileTex = createMarbleTexture(true);
        const boardDarkTileTex = createObsidianTexture(true);

        const whitePieceMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xfbf8f1, map: marbleTex, roughness: 0.22, metalness: 0.05, clearcoat: 0.4, clearcoatRoughness: 0.2
        });
        const blackPieceMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x151221, map: obsidianTex, roughness: 0.12, metalness: 0.35, clearcoat: 0.9, clearcoatRoughness: 0.08,
            emissive: 0x190d2c, emissiveIntensity: 0.35
        });
        const goldTrimMaterial = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.28, metalness: 0.88 });
        const purpleTrimMaterial = new THREE.MeshStandardMaterial({
            color: 0x8b5cf6, roughness: 0.25, metalness: 0.7, emissive: 0x4c1d95, emissiveIntensity: 0.4
        });

        const boardGroup = new THREE.Group();
        scene.add(boardGroup);
        const tileMeshes = [];
        const highlightMeshes = {};
        const vblocksHolos = [];
        let centerMedallionMesh = null;

        function buildChessboard() {
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x161923, roughness: 0.55, metalness: 0.35 });
            const outerSpan = TILE_SIZE * 8 + 1.35;
            const frameMesh = new THREE.Mesh(new THREE.BoxGeometry(outerSpan, 0.46, outerSpan), frameMat);
            frameMesh.position.y = -0.255; frameMesh.receiveShadow = true; // top sits below tiles (no z-fighting)
            boardGroup.add(frameMesh);

            const inlayMesh = new THREE.Mesh(new THREE.BoxGeometry(TILE_SIZE * 8 + 0.32, 0.48, TILE_SIZE * 8 + 0.32), goldTrimMaterial);
            inlayMesh.position.y = -0.252; // top sits just below the tiles so the inlay frames (not covers) the board
            boardGroup.add(inlayMesh);

            const plaqueMat = new THREE.MeshBasicMaterial({ map: createVblocksPlaqueTexture() });
            const plaqueLength = TILE_SIZE * 6.8;
            const halfOuter = outerSpan / 2 + 0.02;
            [
                { pos: [0, -0.22, halfOuter], rot: [0, 0, 0] },
                { pos: [0, -0.22, -halfOuter], rot: [0, Math.PI, 0] },
                { pos: [halfOuter, -0.22, 0], rot: [0, Math.PI / 2, 0] },
                { pos: [-halfOuter, -0.22, 0], rot: [0, -Math.PI / 2, 0] }
            ].forEach(cfg => {
                const pMesh = new THREE.Mesh(new THREE.PlaneGeometry(plaqueLength, 0.42), plaqueMat);
                pMesh.position.set(...cfg.pos);
                pMesh.rotation.set(...cfg.rot);
                boardGroup.add(pMesh);
            });

            const holoMat = new THREE.MeshBasicMaterial({
                map: createCornerHologramTexture(), transparent: true, opacity: 0.88, side: THREE.DoubleSide, depthWrite: false
            });
            const cornerOffset = outerSpan / 2 + 0.25;
            [[-cornerOffset, -cornerOffset], [cornerOffset, -cornerOffset], [-cornerOffset, cornerOffset], [cornerOffset, cornerOffset]]
                .forEach(([cx, cz], idx) => {
                    const obelisk = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.35, 0.7, 6), goldTrimMaterial);
                    obelisk.position.set(cx, 0.12, cz);
                    boardGroup.add(obelisk);
                    const holoGroup = new THREE.Group();
                    holoGroup.position.set(cx, 1.25, cz);
                    const banner1 = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 1.35), holoMat);
                    const banner2 = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 1.35), holoMat);
                    banner2.rotation.y = Math.PI / 2;
                    holoGroup.add(banner1, banner2);
                    const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 0), new THREE.MeshStandardMaterial({
                        color: 0x00f0ff, emissive: 0x00a8ff, emissiveIntensity: 0.9, roughness: 0.1, metalness: 0.9 }));
                    crystal.position.y = 0.95;
                    const halo = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.025, 8, 24), new THREE.MeshBasicMaterial({ color: 0xf59e0b }));
                    halo.position.y = 0.95; halo.rotation.x = Math.PI / 3;
                    holoGroup.add(crystal, halo);
                    boardGroup.add(holoGroup);
                    vblocksHolos.push({ group: holoGroup, basePhase: idx * 1.5 });
                });

            const lightSquareMat = new THREE.MeshStandardMaterial({ color: 0xe2dcd0, map: boardLightTileTex, roughness: 0.32, metalness: 0.1 });
            const darkSquareMat = new THREE.MeshStandardMaterial({ color: 0x1e2230, map: boardDarkTileTex, roughness: 0.25, metalness: 0.28 });
            const tileGeo = new THREE.BoxGeometry(TILE_SIZE * 0.98, 0.2, TILE_SIZE * 0.98);
            const ringGeo = new THREE.RingGeometry(TILE_SIZE * 0.32, TILE_SIZE * 0.42, 24);
            ringGeo.rotateX(-Math.PI / 2);
            const dotGeo = new THREE.CircleGeometry(TILE_SIZE * 0.16, 20);
            dotGeo.rotateX(-Math.PI / 2);

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const isLight = (r + c) % 2 === 0;
                    const sqName = `${FILES[c]}${8 - r}`;
                    const tileMesh = new THREE.Mesh(tileGeo, isLight ? lightSquareMat : darkSquareMat);
                    const x = c * TILE_SIZE - BOARD_OFFSET;
                    const z = r * TILE_SIZE - BOARD_OFFSET;
                    tileMesh.position.set(x, -0.1, z);
                    tileMesh.receiveShadow = true;
                    tileMesh.userData = { square: sqName, row: r, col: c };
                    boardGroup.add(tileMesh);
                    tileMeshes.push(tileMesh);

                    const markerGroup = new THREE.Group();
                    markerGroup.position.set(x, 0.02, z);
                    markerGroup.visible = false;
                    const ringMesh = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.85 }));
                    const dotMesh = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.85 }));
                    markerGroup.add(ringMesh, dotMesh);
                    boardGroup.add(markerGroup);
                    highlightMeshes[sqName] = { group: markerGroup, ring: ringMesh, dot: dotMesh };
                }
            }

            const medallionGeo = new THREE.PlaneGeometry(TILE_SIZE * 3.15, TILE_SIZE * 3.15);
            medallionGeo.rotateX(-Math.PI / 2);
            centerMedallionMesh = new THREE.Mesh(medallionGeo, new THREE.MeshBasicMaterial({
                map: createVblocksCenterMedallionTexture(), transparent: true, opacity: 0.92, depthWrite: false
            }));
            centerMedallionMesh.position.set(0, 0.008, 0);
            boardGroup.add(centerMedallionMesh);
        }
        buildChessboard();

        function squareToWorld(square) {
            const col = FILES.indexOf(square[0]);
            const row = 8 - parseInt(square[1], 10);
            return new THREE.Vector3(col * TILE_SIZE - BOARD_OFFSET, 0, row * TILE_SIZE - BOARD_OFFSET);
        }

        // --- Chess pieces ---
        function createWizardPieceMesh(type, color) {
            const group = new THREE.Group();
            const mainMat = color === 'w' ? whitePieceMaterial : blackPieceMaterial;
            const trimMat = color === 'w' ? goldTrimMaterial : purpleTrimMaterial;
            const add = (mesh, x, y, z, shadow = true) => { mesh.position.set(x, y, z); mesh.castShadow = shadow; group.add(mesh); return mesh; };

            add(new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.44, 0.18, 16), mainMat), 0, 0.09, 0).receiveShadow = true;
            const collarGeo = new THREE.TorusGeometry(0.35, 0.035, 10, 24);
            collarGeo.rotateX(Math.PI / 2);
            add(new THREE.Mesh(collarGeo, trimMat), 0, 0.18, 0, false);
            const fwd = color === 'w' ? -1 : 1;

            if (type === 'p') {
                add(new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.32, 0.58, 12), mainMat), 0, 0.47, 0);
                add(new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.38, 0.12), trimMat), 0, 0.48, 0.18 * fwd);
                add(new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 1), mainMat), 0, 0.92, 0);
                add(new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.72, 6), trimMat), -0.22, 0.66, 0.12 * fwd); // halberd pike
            } else if (type === 'r') {
                add(new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.35, 0.95, 8), mainMat), 0, 0.65, 0);
                add(new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.3, 0.25, 8), mainMat), 0, 1.2, 0);
                for (let i = 0; i < 4; i++) {
                    const a = (i * Math.PI) / 2;
                    add(new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.18, 0.14), trimMat), Math.cos(a) * 0.24, 1.38, Math.sin(a) * 0.24, false);
                }
                add(new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.38, 6), trimMat), 0, 0.62, 0.38 * fwd).rotation.x = (Math.PI / 2) * fwd; // siege ram
            } else if (type === 'n') {
                add(new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.34, 0.55, 10), mainMat), 0, 0.45, 0);
                add(new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.68, 0.36), mainMat), 0, 0.92, 0.05 * fwd).rotation.x = 0.28 * fwd;
                add(new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.45, 6), mainMat), 0, 1.18, 0.26 * fwd).rotation.x = (Math.PI / 2.4) * fwd;
                add(new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.62, 0.12), trimMat), 0, 0.96, -0.14 * fwd, false).rotation.x = 0.25 * fwd;
                add(new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.88, 8), trimMat), 0.26, 0.78, 0.2 * fwd).rotation.x = (Math.PI / 3) * fwd; // war lance
            } else if (type === 'b') {
                add(new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.34, 0.98, 14), mainMat), 0, 0.67, 0);
                add(new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.52, 12), mainMat), 0, 1.38, 0);
                add(new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.025, 8, 20), trimMat), 0, 1.22, 0, false).rotation.x = Math.PI / 2;
                add(new THREE.Mesh(new THREE.OctahedronGeometry(0.09, 0), trimMat), 0, 1.68, 0, false);
                add(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.98, 8), trimMat), 0.28, 0.7, 0.14 * fwd); // crosier staff
                add(new THREE.Mesh(new THREE.OctahedronGeometry(0.07, 0), trimMat), 0.28, 1.23, 0.14 * fwd, false);
            } else if (type === 'q') {
                add(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.37, 1.18, 16), mainMat), 0, 0.77, 0);
                add(new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.21, 0.25, 12), trimMat), 0, 1.45, 0, false);
                group.userData.floatingGem = add(new THREE.Mesh(new THREE.OctahedronGeometry(0.16, 0), mainMat), 0, 1.72, 0);
                add(new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.82, 6), trimMat), -0.28, 0.8, 0.15 * fwd); // arcane scepter
            } else if (type === 'k') {
                add(new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.39, 1.28, 12), mainMat), 0, 0.82, 0);
                add(new THREE.Mesh(new THREE.CylinderGeometry(0.31, 0.25, 0.28, 8), trimMat), 0, 1.55, 0);
                add(new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.34, 0.09), trimMat), 0, 1.84, 0, false);
                add(new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.08, 0.09), trimMat), 0, 1.88, 0, false);
                add(new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.95, 0.04), trimMat), 0, 0.72, 0.36 * fwd); // greatsword
                add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 0.07), trimMat), 0, 1.0, 0.36 * fwd, false);
            }
            return group;
        }

        // --- Checkers pieces: carved marble/obsidian discs; kings are stacked & crowned ---
        function createCheckerPieceMesh(type, color) {
            const group = new THREE.Group();
            const mainMat = color === 'w' ? whitePieceMaterial : blackPieceMaterial;
            const trimMat = color === 'w' ? goldTrimMaterial : purpleTrimMaterial;

            const addDisc = (y) => {
                const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.45, 0.2, 32), mainMat);
                disc.position.y = y; disc.castShadow = true; disc.receiveShadow = true;
                group.add(disc);
                const rimGeo = new THREE.TorusGeometry(0.425, 0.032, 10, 32);
                rimGeo.rotateX(Math.PI / 2);
                const rim = new THREE.Mesh(rimGeo, trimMat);
                rim.position.y = y + 0.1;
                group.add(rim);
                const grooveGeo = new THREE.TorusGeometry(0.28, 0.018, 8, 28);
                grooveGeo.rotateX(Math.PI / 2);
                const groove = new THREE.Mesh(grooveGeo, trimMat);
                groove.position.y = y + 0.102;
                group.add(groove);
            };

            addDisc(0.1);
            // V-chevron VBLOCKS emblem on the top face
            const emblemY = type === 'k' ? 0.53 : 0.21;
            if (type !== 'k') {
                const vL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.02, 0.24), trimMat);
                vL.position.set(-0.06, emblemY, 0); vL.rotation.y = 0.45; group.add(vL);
                const vR = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.02, 0.24), trimMat);
                vR.position.set(0.06, emblemY, 0); vR.rotation.y = -0.45; group.add(vR);
            } else {
                addDisc(0.31);
                // Crown of 6 points + floating gem
                const crownBand = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.24, 0.1, 18), trimMat);
                crownBand.position.y = 0.47; crownBand.castShadow = true; group.add(crownBand);
                for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2;
                    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.16, 6), trimMat);
                    spike.position.set(Math.cos(a) * 0.2, 0.6, Math.sin(a) * 0.2);
                    group.add(spike);
                }
                const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.1, 0), color === 'w' ? goldTrimMaterial : purpleTrimMaterial);
                gem.position.y = 0.78; gem.castShadow = true;
                group.add(gem);
                group.userData.floatingGem = gem;
            }
            return group;
        }

        /***********************************************************************
         * 5. KNOCK-DOWN DEBRIS, SHOCKWAVES & DUST
         ***********************************************************************/
        const activeFragments = [];
        const activeShockwaves = [];
        const activeDustPlumes = [];

        function spawnImpactPlume(worldPos, colorHex = 0xfbbf24, count = 18) {
            const plumeMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.85 });
            for (let i = 0; i < count; i++) {
                const pMesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.05 + Math.random() * 0.07, 0), plumeMat.clone());
                pMesh.position.set(worldPos.x + (Math.random() - 0.5) * 0.45, 0.08 + Math.random() * 0.25, worldPos.z + (Math.random() - 0.5) * 0.45);
                scene.add(pMesh);
                const angle = Math.random() * Math.PI * 2;
                const spd = 0.8 + Math.random() * 2.6;
                activeDustPlumes.push({
                    mesh: pMesh,
                    vel: new THREE.Vector3(Math.cos(angle) * spd, 0.8 + Math.random() * 1.8, Math.sin(angle) * spd),
                    life: 1.0, decay: 1.4 + Math.random() * 0.8
                });
            }
        }

        function spawnShockwave(worldPos, colorHex) {
            const ringGeo = new THREE.RingGeometry(0.15, 0.36, 32);
            ringGeo.rotateX(-Math.PI / 2);
            const ringMesh = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.95, side: THREE.DoubleSide }));
            ringMesh.position.set(worldPos.x, 0.03, worldPos.z);
            scene.add(ringMesh);
            activeShockwaves.push({ mesh: ringMesh, scale: 1, opacity: 0.95 });
        }

        // Breaks the toppled piece apart into its ACTUAL sculpted segments (base, body, head,
        // crown, weapon...) — each cloned into world space as a tumbling rigid-body chunk.
        function spawnSegmentChunks(victimMesh, impactDir) {
            victimMesh.updateMatrixWorld(true);
            const parts = victimMesh.children.filter(c => c.isMesh);
            parts.forEach((part, idx) => {
                const chunk = part.clone();
                part.getWorldPosition(chunk.position);
                part.getWorldQuaternion(chunk.quaternion);
                chunk.castShadow = true;
                scene.add(chunk);
                const lateral = new THREE.Vector3(-impactDir.z, 0, impactDir.x).multiplyScalar((Math.random() - 0.5) * 2.6);
                const boost = 1.0 + (idx / Math.max(1, parts.length - 1)) * 1.6 + Math.random() * 1.1;
                activeFragments.push({
                    mesh: chunk, shared: true,
                    velocity: new THREE.Vector3(impactDir.x * 2.2 * boost + lateral.x, 1.2 + idx * 0.35 + Math.random() * 1.6, impactDir.z * 2.2 * boost + lateral.z),
                    rotSpeed: new THREE.Vector3((Math.random() - 0.5) * 9, (Math.random() - 0.5) * 9, (Math.random() - 0.5) * 9),
                    floorY: 0.1, life: 1.0, decay: 0.3 + Math.random() * 0.1
                });
            });
        }

        function spawnKnockdownFracture(worldPos, victimColor, impactDir = new THREE.Vector3(0, 0, 1), discShaped = false, victimMesh = null) {
            const fragMat = victimColor === 'w' ? whitePieceMaterial : blackPieceMaterial;
            const accentMat = victimColor === 'w' ? goldTrimMaterial : purpleTrimMaterial;
            if (victimMesh) spawnSegmentChunks(victimMesh, impactDir);

            const structural = victimMesh ? [] : discShaped ? [
                { geo: new THREE.CylinderGeometry(0.42, 0.45, 0.1, 6, 1, false, 0, Math.PI), mat: fragMat, yOff: 0.15, boost: 1.0 },
                { geo: new THREE.CylinderGeometry(0.42, 0.45, 0.1, 6, 1, false, Math.PI, Math.PI * 0.6), mat: fragMat, yOff: 0.2, boost: 1.5 },
                { geo: new THREE.TorusGeometry(0.3, 0.03, 8, 16, Math.PI), mat: accentMat, yOff: 0.25, boost: 1.9 }
            ] : [
                { geo: new THREE.CylinderGeometry(0.28, 0.36, 0.22, 12), mat: fragMat, yOff: 0.15, boost: 0.8 },
                { geo: new THREE.CylinderGeometry(0.18, 0.26, 0.48, 10), mat: fragMat, yOff: 0.35, boost: 1.45 },
                { geo: new THREE.OctahedronGeometry(0.22, 1), mat: accentMat, yOff: 0.55, boost: 2.1 },
                { geo: new THREE.TorusGeometry(0.28, 0.04, 8, 16), mat: accentMat, yOff: 0.25, boost: 1.2 }
            ];

            structural.forEach(chunk => {
                const mesh = new THREE.Mesh(chunk.geo, chunk.mat);
                mesh.position.set(worldPos.x + impactDir.x * 0.25 + (Math.random() - 0.5) * 0.2, chunk.yOff, worldPos.z + impactDir.z * 0.25 + (Math.random() - 0.5) * 0.2);
                mesh.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
                mesh.castShadow = true;
                scene.add(mesh);
                const lateral = new THREE.Vector3(-impactDir.z, 0, impactDir.x).multiplyScalar((Math.random() - 0.5) * 2.2);
                activeFragments.push({
                    mesh,
                    velocity: new THREE.Vector3(impactDir.x * 2.6 * chunk.boost + lateral.x, 1.4 + Math.random() * 2.0, impactDir.z * 2.6 * chunk.boost + lateral.z),
                    rotSpeed: new THREE.Vector3((Math.random() - 0.5) * 9, (Math.random() - 0.5) * 9, (Math.random() - 0.5) * 9),
                    floorY: 0.12, life: 1.0, decay: 0.24 + Math.random() * 0.12
                });
            });

            for (let i = 0; i < 30; i++) {
                const size = 0.06 + Math.random() * 0.14;
                const geo = i % 3 === 0 ? new THREE.OctahedronGeometry(size, 0) : new THREE.TetrahedronGeometry(size, 0);
                const mesh = new THREE.Mesh(geo, i % 5 === 0 ? accentMat : fragMat);
                mesh.position.set(worldPos.x + (Math.random() - 0.5) * 0.45, 0.18 + Math.random() * 0.55, worldPos.z + (Math.random() - 0.5) * 0.45);
                mesh.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
                mesh.castShadow = true;
                scene.add(mesh);
                const spreadAngle = Math.atan2(impactDir.z, impactDir.x) + (Math.random() - 0.5) * 2.1;
                const speed = 1.6 + Math.random() * 4.5;
                activeFragments.push({
                    mesh,
                    velocity: new THREE.Vector3(Math.cos(spreadAngle) * speed, 1.8 + Math.random() * 3.6, Math.sin(spreadAngle) * speed),
                    rotSpeed: new THREE.Vector3((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14),
                    floorY: 0.06, life: 1.0, decay: 0.35 + Math.random() * 0.28
                });
            }

            spawnImpactPlume(worldPos, victimColor === 'w' ? 0xfef3c7 : 0xc084fc, 22);
            spawnShockwave(worldPos, victimColor === 'w' ? 0xfbbf24 : 0x38bdf8);
        }

        function updateParticlesAndEffects(dt) {
            for (let i = activeFragments.length - 1; i >= 0; i--) {
                const frag = activeFragments[i];
                frag.velocity.y -= 15.5 * dt;
                frag.mesh.position.addScaledVector(frag.velocity, dt);
                const minH = frag.floorY || 0.06;
                if (frag.mesh.position.y < minH) {
                    frag.mesh.position.y = minH;
                    frag.velocity.y *= -0.36;
                    frag.velocity.x *= 0.80;
                    frag.velocity.z *= 0.80;
                    frag.rotSpeed.multiplyScalar(0.82);
                }
                frag.mesh.rotation.x += frag.rotSpeed.x * dt;
                frag.mesh.rotation.y += frag.rotSpeed.y * dt;
                frag.mesh.rotation.z += frag.rotSpeed.z * dt;
                frag.life -= frag.decay * dt;
                if (frag.life <= 0) {
                    scene.remove(frag.mesh);
                    if (!frag.shared) frag.mesh.geometry.dispose();
                    activeFragments.splice(i, 1);
                } else if (frag.life < 0.28) {
                    frag.mesh.scale.setScalar(Math.max(0.01, frag.life / 0.28));
                }
            }
            for (let i = activeDustPlumes.length - 1; i >= 0; i--) {
                const p = activeDustPlumes[i];
                p.vel.y -= 3.5 * dt;
                p.mesh.position.addScaledVector(p.vel, dt);
                p.life -= p.decay * dt;
                if (p.life <= 0) {
                    scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mesh.material.dispose();
                    activeDustPlumes.splice(i, 1);
                } else {
                    p.mesh.material.opacity = p.life * 0.8;
                    p.mesh.scale.setScalar(1 + (1 - p.life) * 1.5);
                }
            }
            for (let i = activeShockwaves.length - 1; i >= 0; i--) {
                const sw = activeShockwaves[i];
                sw.scale += 6.5 * dt;
                sw.opacity -= 1.8 * dt;
                sw.mesh.scale.setScalar(sw.scale);
                sw.mesh.material.opacity = Math.max(0, sw.opacity);
                if (sw.opacity <= 0) {
                    scene.remove(sw.mesh); sw.mesh.geometry.dispose(); sw.mesh.material.dispose();
                    activeShockwaves.splice(i, 1);
                }
            }
        }

        /***********************************************************************
         * 6. CHECKERS ENGINE (English draughts: 8x8, forced capture,
         *    multi-jumps, men move forward, kings both ways, crowning ends turn)
         ***********************************************************************/
        const CK_ALL_DIRS = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
        const ckSq = (r, c) => `${FILES[c]}${8 - r}`;
        const ckInB = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;
        const ckOpp = (color) => (color === 'w' ? 'b' : 'w');
        const ckCrownRow = (color) => (color === 'w' ? 0 : 7);
        function ckDirs(p) {
            if (p.type === 'k') return CK_ALL_DIRS;
            return p.color === 'w' ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]];
        }

        function ckJumps(grid, r, c, p, path, caps, out) {
            let extended = false;
            for (const [dr, dc] of ckDirs(p)) {
                const mr = r + dr, mc = c + dc, lr = r + 2 * dr, lc = c + 2 * dc;
                if (!ckInB(lr, lc)) continue;
                const mid = grid[mr][mc];
                if (!mid || mid.color === p.color) continue;
                if (caps.some(([a, b]) => a === mr && b === mc)) continue;
                if (grid[lr][lc] !== null) continue;
                extended = true;
                const nPath = path.concat([[lr, lc]]);
                const nCaps = caps.concat([[mr, mc]]);
                if (p.type === 'c' && lr === ckCrownRow(p.color)) {
                    out.push({ path: nPath, caps: nCaps, promote: true });
                } else {
                    ckJumps(grid, lr, lc, p, nPath, nCaps, out);
                }
            }
            if (!extended && caps.length) out.push({ path, caps, promote: false });
        }

        function ckGenMoves(grid, color) {
            const jumps = [], steps = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = grid[r][c];
                    if (!p || p.color !== color) continue;
                    const out = [];
                    grid[r][c] = null;
                    ckJumps(grid, r, c, p, [], [], out);
                    grid[r][c] = p;
                    out.forEach(j => jumps.push({ fr: r, fc: c, path: j.path, caps: j.caps, promote: j.promote }));
                    if (jumps.length) continue;
                    for (const [dr, dc] of ckDirs(p)) {
                        const nr = r + dr, nc = c + dc;
                        if (ckInB(nr, nc) && grid[nr][nc] === null) {
                            steps.push({ fr: r, fc: c, path: [[nr, nc]], caps: [], promote: p.type === 'c' && nr === ckCrownRow(color) });
                        }
                    }
                }
            }
            return jumps.length ? jumps : steps;
        }

        function ckApply(grid, m) {
            const g = grid.map(row => row.slice());
            const p = g[m.fr][m.fc];
            g[m.fr][m.fc] = null;
            m.caps.forEach(([a, b]) => { g[a][b] = null; });
            const [tr, tc] = m.path[m.path.length - 1];
            g[tr][tc] = m.promote ? { type: 'k', color: p.color } : p;
            return g;
        }

        function ckEval(grid, color) {
            let score = 0;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = grid[r][c];
                    if (!p) continue;
                    let v;
                    if (p.type === 'k') {
                        v = 175;
                    } else {
                        const adv = p.color === 'w' ? 7 - r : r;
                        v = 100 + adv * 5;
                        if ((p.color === 'w' && r === 7) || (p.color === 'b' && r === 0)) v += 8; // back-rank guard
                    }
                    if (c >= 2 && c <= 5 && r >= 2 && r <= 5) v += 5;
                    if (c === 0 || c === 7) v -= 3;
                    score += p.color === color ? v : -v;
                }
            }
            return score;
        }

        function ckNegamax(grid, color, depth, alpha, beta) {
            const moves = ckGenMoves(grid, color);
            if (!moves.length) return -(100000 + depth);
            if (depth === 0) return ckEval(grid, color);
            let best = -Infinity;
            for (const m of moves) {
                const s = -ckNegamax(ckApply(grid, m), ckOpp(color), depth - 1, -beta, -alpha);
                if (s > best) best = s;
                if (best > alpha) alpha = best;
                if (alpha >= beta) break;
            }
            return best;
        }

        class CheckersGame {
            constructor() { this.reset(); }
            reset() {
                this.grid = Array.from({ length: 8 }, () => Array(8).fill(null));
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if ((r + c) % 2 !== 1) continue; // dark squares only
                        if (r <= 2) this.grid[r][c] = { type: 'c', color: 'b' };
                        if (r >= 5) this.grid[r][c] = { type: 'c', color: 'w' };
                    }
                }
                this.turnColor = 'w';
                this.quietPlies = 0;
                this.hist = [];
            }
            turn() { return this.turnColor; }
            board() { return this.grid; }
            get(sq) {
                const c = FILES.indexOf(sq[0]), r = 8 - parseInt(sq[1], 10);
                return this.grid[r][c];
            }
            _wrap(m) {
                const p = this.grid[m.fr][m.fc];
                const last = m.path[m.path.length - 1];
                return {
                    from: ckSq(m.fr, m.fc),
                    to: ckSq(last[0], last[1]),
                    path: m.path.map(([r, c]) => ckSq(r, c)),
                    capturedSquares: m.caps.map(([r, c]) => ckSq(r, c)),
                    captured: m.caps.length ? m.caps.map(([r, c]) => this.grid[r][c].type) : undefined,
                    promote: m.promote,
                    color: p.color,
                    piece: p.type,
                    flags: '',
                    _raw: m
                };
            }
            moves(opts = {}) {
                let list = ckGenMoves(this.grid, this.turnColor).map(m => this._wrap(m));
                if (opts.square) list = list.filter(m => m.from === opts.square);
                return list;
            }
            mustCapture() {
                const list = ckGenMoves(this.grid, this.turnColor);
                return list.length > 0 && list[0].caps.length > 0;
            }
            captureSources() {
                const list = ckGenMoves(this.grid, this.turnColor);
                if (!list.length || !list[0].caps.length) return [];
                return [...new Set(list.map(m => ckSq(m.fr, m.fc)))];
            }
            move(mv) {
                this.hist.push({ grid: this.grid, turn: this.turnColor, quiet: this.quietPlies, move: mv });
                this.grid = ckApply(this.grid, mv._raw);
                this.quietPlies = (mv._raw.caps.length || mv.piece === 'c') ? 0 : this.quietPlies + 1;
                this.turnColor = ckOpp(this.turnColor);
                return mv;
            }
            undo() {
                const h = this.hist.pop();
                if (!h) return null;
                this.grid = h.grid; this.turnColor = h.turn; this.quietPlies = h.quiet;
                return h.move;
            }
            history() { return this.hist.map(h => h.move); }
            hasMoves() { return ckGenMoves(this.grid, this.turnColor).length > 0; }
            isDraw() { return this.quietPlies >= 80; } // 40 king moves each without capture or man advance
            isGameOver() { return !this.hasMoves() || this.isDraw(); }
            bestMove(depth = 6) {
                const raw = ckGenMoves(this.grid, this.turnColor);
                for (let i = raw.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [raw[i], raw[j]] = [raw[j], raw[i]]; }
                let best = raw[0], bestS = -Infinity;
                for (const m of raw) {
                    const s = -ckNegamax(ckApply(this.grid, m), ckOpp(this.turnColor), depth - 1, -Infinity, -bestS);
                    if (s > bestS) { bestS = s; best = m; }
                }
                return best ? this._wrap(best) : null;
            }
        }

        /***********************************************************************
         * 7. SHARED GAME STATE, ANIMATIONS & AUTOMATON AI
         ***********************************************************************/
        const chess = new Chess();
        const checkers = new CheckersGame();
        let gameMode = 'chess'; // 'chess' | 'checkers'
        const pieceMeshes = {};
        let selectedSquare = null;
        let legalMovesForSelected = [];
        let isAnimating = false;
        let playVsAI = true;
        let pendingPromotionMove = null;
        let gameOverShown = false;
        let modalState = null; // null | 'promo' | 'over'
        let aiTimer = null;
        const activeAnimations = [];

        const isChess = () => gameMode === 'chess';
        const currentTurn = () => (isChess() ? chess.turn() : checkers.turn());
        const isGameOver = () => (isChess() ? chess.game_over() : checkers.isGameOver());
        const moveHistory = () => (isChess() ? chess.history({ verbose: true }) : checkers.history());

        function syncBoardFromState() {
            Object.keys(pieceMeshes).forEach(sq => { scene.remove(pieceMeshes[sq]); delete pieceMeshes[sq]; });
            const board = isChess() ? chess.board() : checkers.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (!piece) continue;
                    const sq = `${FILES[c]}${8 - r}`;
                    const mesh = isChess() ? createWizardPieceMesh(piece.type, piece.color) : createCheckerPieceMesh(piece.type, piece.color);
                    mesh.position.copy(squareToWorld(sq));
                    mesh.userData.square = sq;
                    mesh.userData.type = piece.type;
                    mesh.userData.color = piece.color;
                    mesh.userData.phase = Math.random() * Math.PI * 2;
                    scene.add(mesh);
                    pieceMeshes[sq] = mesh;
                }
            }
            clearHighlights();
            updateUI();
        }

        function setMarker(sq, ringHex, dotHex) {
            const h = highlightMeshes[sq];
            if (!h) return;
            h.group.visible = true;
            h.ring.material.color.setHex(ringHex);
            if (dotHex === null) { h.dot.visible = false; } else { h.dot.visible = true; h.dot.material.color.setHex(dotHex); }
        }

        function clearHighlights() {
            Object.values(highlightMeshes).forEach(h => { h.group.visible = false; });
            if (isChess()) {
                if (chess.in_check()) {
                    const turnColor = chess.turn();
                    Object.keys(pieceMeshes).forEach(sq => {
                        const m = pieceMeshes[sq];
                        if (m && m.userData.type === 'k' && m.userData.color === turnColor) setMarker(sq, 0xef4444, null);
                    });
                }
            } else if (!isAnimating && !isGameOver() && !(playVsAI && checkers.turn() === 'b')) {
                // Forced-capture hint: mark every piece that must jump
                checkers.captureSources().forEach(sq => setMarker(sq, 0xf43f5e, null));
            }
        }

        function showHighlightsForSquare(sq) {
            clearHighlights();
            setMarker(sq, 0xfbbf24, null);
            legalMovesForSelected.forEach(m => {
                if (m.captured || m.flags.includes('e')) setMarker(m.to, 0xf43f5e, 0xf43f5e);
                else setMarker(m.to, 0x38bdf8, 0x38bdf8);
            });
        }

        function focusActionCam(endPos) {
            const saved = { radius: cameraControl.targetRadius, phi: cameraControl.targetPhi };
            if (useActionCam) {
                cameraControl.desiredLookAt.set(endPos.x * 0.55, 0.5, endPos.z * 0.55);
                cameraControl.targetRadius = Math.max(13.5, saved.radius - 4.2);
            }
            return () => {
                if (useActionCam) {
                    cameraControl.desiredLookAt.set(0, 0.4, 0);
                    cameraControl.targetRadius = saved.radius;
                    cameraControl.targetPhi = saved.phi;
                }
            };
        }

        // ---------- CHESS move animation ----------
        function executeAnimatedMove(moveObj, onComplete) {
            isAnimating = true;
            clearHighlights();
            const fromSq = moveObj.from, toSq = moveObj.to;
            const attackerMesh = pieceMeshes[fromSq];
            let victimSq = toSq;
            if (moveObj.flags.includes('e')) victimSq = `${toSq[0]}${moveObj.color === 'w' ? '5' : '4'}`;
            const victimMesh = pieceMeshes[victimSq];
            const startPos = squareToWorld(fromSq), endPos = squareToWorld(toSq);

            if (moveObj.flags.includes('k') || moveObj.flags.includes('q')) {
                const rank = moveObj.color === 'w' ? '1' : '8';
                const rookFrom = moveObj.flags.includes('k') ? `h${rank}` : `a${rank}`;
                const rookTo = moveObj.flags.includes('k') ? `f${rank}` : `d${rank}`;
                const rookMesh = pieceMeshes[rookFrom];
                if (rookMesh) {
                    delete pieceMeshes[rookFrom];
                    pieceMeshes[rookTo] = rookMesh;
                    rookMesh.userData.square = rookTo;
                    activeAnimations.push({ type: 'slide', mesh: rookMesh, startPos: squareToWorld(rookFrom), endPos: squareToWorld(rookTo), elapsed: 0, duration: 0.48 });
                }
            }

            if (victimMesh) {
                const impactDir = new THREE.Vector3().subVectors(endPos, startPos);
                if (impactDir.lengthSq() < 0.001) impactDir.set(0, 0, 1);
                impactDir.normalize();
                const toppleAxis = new THREE.Vector3(0, 1, 0).cross(impactDir).normalize();
                const restoreCam = focusActionCam(endPos);
                showCombatTelemetry('K.O.');
                activeAnimations.push({
                    type: 'attack_knockdown', mesh: attackerMesh, victimMesh, victimSq,
                    victimColor: moveObj.color === 'w' ? 'b' : 'w',
                    startPos, endPos, victimStartPos: victimMesh.position.clone().setY(0),
                    impactDir, toppleAxis, hitTriggered: false, shattered: false,
                    elapsed: 0, duration: 1.18,
                    onDone: () => { restoreCam(); finalizeMoveState(fromSq, toSq, moveObj, attackerMesh); if (onComplete) onComplete(); }
                });
            } else {
                const isKnight = moveObj.piece === 'n';
                soundFX.playMove(moveObj.piece === 'r' || moveObj.piece === 'k');
                activeAnimations.push({
                    type: isKnight ? 'leap' : 'slide', mesh: attackerMesh, startPos, endPos,
                    elapsed: 0, duration: isKnight ? 0.52 : 0.38,
                    onDone: () => { finalizeMoveState(fromSq, toSq, moveObj, attackerMesh); if (onComplete) onComplete(); }
                });
            }
        }

        function finalizeMoveState(fromSq, toSq, moveObj, attackerMesh) {
            delete pieceMeshes[fromSq];
            if (moveObj.flags.includes('p') && moveObj.promotion) {
                scene.remove(attackerMesh);
                const promotedMesh = createWizardPieceMesh(moveObj.promotion, moveObj.color);
                promotedMesh.position.copy(squareToWorld(toSq));
                Object.assign(promotedMesh.userData, { square: toSq, type: moveObj.promotion, color: moveObj.color, phase: Math.random() * Math.PI * 2 });
                scene.add(promotedMesh);
                pieceMeshes[toSq] = promotedMesh;
                spawnImpactPlume(squareToWorld(toSq), 0xfbbf24, 24);
                spawnShockwave(squareToWorld(toSq), 0xfbbf24);
                soundFX.playCrown();
            } else {
                pieceMeshes[toSq] = attackerMesh;
                attackerMesh.userData.square = toSq;
                attackerMesh.position.copy(squareToWorld(toSq));
                attackerMesh.rotation.set(0, 0, 0);
            }
            isAnimating = false;
            if (moveObj.promotion) showCombatTelemetry('PROMOTED', ({ q: '♛', r: '♜', b: '♝', n: '♞' })[moveObj.promotion]);
            if (chess.in_checkmate()) showCombatTelemetry('CHECKMATE', '', 1600);
            else if (chess.in_check()) { soundFX.playCheck(); showCombatTelemetry('CHECK'); }
            clearHighlights();
            updateUI();
            maybeTriggerAI();
        }

        // ---------- CHECKERS move animation ----------
        function executeCheckersMove(mv) {
            isAnimating = true;
            clearHighlights();
            const mesh = pieceMeshes[mv.from];
            const points = [squareToWorld(mv.from), ...mv.path.map(squareToWorld)];

            if (!mv.capturedSquares.length) {
                soundFX.playMove(mv.piece === 'k');
                activeAnimations.push({
                    type: 'slide', mesh, startPos: points[0], endPos: points[1], elapsed: 0, duration: 0.4,
                    onDone: () => finalizeCheckersMove(mv, mesh)
                });
                return;
            }

            const victims = mv.capturedSquares.map((sq, i) => {
                const dir = new THREE.Vector3().subVectors(points[i + 1], points[i]).setY(0).normalize();
                const vm = pieceMeshes[sq];
                return {
                    mesh: vm, sq,
                    pos: vm ? vm.position.clone().setY(0) : squareToWorld(sq),
                    dir, axis: new THREE.Vector3(0, 1, 0).cross(dir).normalize(),
                    color: mv.color === 'w' ? 'b' : 'w', hit: false, shattered: false
                };
            });
            const restoreCam = focusActionCam(points[points.length - 1]);
            const n = victims.length;
            showCombatTelemetry(n === 1 ? 'K.O.' : 'CHAIN ×' + n);
            activeAnimations.push({
                type: 'checker_jumps', mesh, points, victims, elapsed: 0,
                duration: 0.66 * (points.length - 1),
                onDone: () => { restoreCam(); finalizeCheckersMove(mv, mesh); }
            });
        }

        function shatterCheckerVictim(v) {
            if (v.shattered) return;
            v.shattered = true;
            soundFX.playGroundSlamAndShatter();
            cameraControl.triggerShake(0.45);
            const pos = v.mesh ? v.mesh.position.clone() : v.pos.clone();
            spawnKnockdownFracture(pos, v.color, v.dir, true, v.mesh || null);
            if (v.mesh) {
                scene.remove(v.mesh);
                if (pieceMeshes[v.sq] === v.mesh) delete pieceMeshes[v.sq];
            }
        }

        function finalizeCheckersMove(mv, mesh) {
            delete pieceMeshes[mv.from];
            const endPos = squareToWorld(mv.to);
            if (mv.promote) {
                scene.remove(mesh);
                const km = createCheckerPieceMesh('k', mv.color);
                km.position.copy(endPos);
                Object.assign(km.userData, { square: mv.to, type: 'k', color: mv.color, phase: Math.random() * Math.PI * 2 });
                scene.add(km);
                pieceMeshes[mv.to] = km;
                spawnImpactPlume(endPos, 0xfbbf24, 26);
                spawnShockwave(endPos, 0xfbbf24);
                soundFX.playCrown();
                showCombatTelemetry('CROWNED', '⛁');
            } else {
                pieceMeshes[mv.to] = mesh;
                mesh.userData.square = mv.to;
                mesh.position.copy(endPos);
                mesh.rotation.set(0, 0, 0);
            }
            isAnimating = false;
            clearHighlights();
            updateUI();
            maybeTriggerAI();
        }

        let telemetryTimer = null;
        function showCombatTelemetry(title, subtitle = '', ms = 1300, small = false) {
            const el = document.getElementById('combat-telemetry');
            if (!el) return;
            document.getElementById('telemetry-title').textContent = title;
            document.getElementById('telemetry-subtitle').textContent = subtitle;
            el.classList.toggle('small', !!small);
            el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
            clearTimeout(telemetryTimer);
            telemetryTimer = setTimeout(() => el.classList.remove('show'), ms);
        }

        // One-click showcase duel on the centre VBLOCKS medallion (does not affect the game)
        function triggerDemoKnockDown() {
            if (isAnimating || titleOpen || modalState) return;
            isAnimating = true;
            clearTimeout(aiTimer);
            selectedSquare = null; legalMovesForSelected = [];
            clearHighlights();
            const hideSqs = isChess() ? ['d4', 'e5'] : ['d4', 'e5', 'f6'];
            const hidden = [];
            hideSqs.forEach(sq => { if (pieceMeshes[sq]) { pieceMeshes[sq].visible = false; hidden.push(pieceMeshes[sq]); } });
            const pick = arr => arr[Math.floor(Math.random() * arr.length)];
            const fromPos = squareToWorld('d4'), toPos = squareToWorld('e5');
            const attacker = isChess() ? createWizardPieceMesh(pick(['k', 'q', 'n', 'r']), 'w') : createCheckerPieceMesh(pick(['c', 'k']), 'w');
            const defender = isChess() ? createWizardPieceMesh(pick(['q', 'k', 'r', 'b']), 'b') : createCheckerPieceMesh(pick(['c', 'k']), 'b');
            attacker.position.copy(fromPos); defender.position.copy(toPos);
            scene.add(attacker, defender);
            const restoreCam = focusActionCam(toPos);
            showCombatTelemetry('DEMO', 'K.O.', 1500);
            const epoch = animEpoch;
            const finish = () => {
                setTimeout(() => {
                    scene.remove(attacker);
                    if (epoch !== animEpoch) return;
                    hidden.forEach(m => { m.visible = true; });
                    restoreCam();
                    isAnimating = false;
                    clearHighlights();
                    updateUI();
                    maybeTriggerAI();
                }, 500);
            };
            const dir = new THREE.Vector3().subVectors(toPos, fromPos).normalize();
            if (isChess()) {
                activeAnimations.push({
                    type: 'attack_knockdown', mesh: attacker, victimMesh: defender, victimSq: null, victimColor: 'b',
                    startPos: fromPos, endPos: toPos, victimStartPos: toPos.clone(), impactDir: dir,
                    toppleAxis: new THREE.Vector3(0, 1, 0).cross(dir).normalize(),
                    hitTriggered: false, shattered: false, elapsed: 0, duration: 1.18, onDone: finish
                });
            } else {
                activeAnimations.push({
                    type: 'checker_jumps', mesh: attacker, points: [fromPos, squareToWorld('f6')],
                    victims: [{ mesh: defender, sq: null, pos: toPos.clone(), dir, axis: new THREE.Vector3(0, 1, 0).cross(dir).normalize(), color: 'b', hit: false, shattered: false }],
                    elapsed: 0, duration: 0.8, onDone: finish
                });
            }
        }

        function maybeTriggerAI() {
            clearTimeout(aiTimer);
            if (!titleOpen && !isGameOver() && playVsAI && currentTurn() === 'b') aiTimer = setTimeout(triggerAutomatonMove, 420);
        }

        function triggerAutomatonMove() {
            if (titleOpen || isGameOver() || isAnimating || !playVsAI || currentTurn() !== 'b') return;
            if (!isChess()) {
                const mv = checkers.bestMove(6);
                if (mv) executeCheckersMove(checkers.move(mv));
                return;
            }
            const legalMoves = chess.moves({ verbose: true });
            if (!legalMoves.length) return;
            const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
            function evaluateBoard() {
                const b = chess.board();
                let score = 0;
                for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
                    const p = b[r][c];
                    if (!p) continue;
                    const val = pieceValues[p.type] + (3.5 - Math.abs(3.5 - c)) * 4 + (3.5 - Math.abs(3.5 - r)) * 4;
                    score += p.color === 'b' ? val : -val;
                }
                return score;
            }
            let bestMove = legalMoves[0], bestScore = -Infinity;
            for (const m of legalMoves) {
                chess.move(m);
                let replyWorst = Infinity;
                const oppMoves = chess.moves({ verbose: true });
                if (!oppMoves.length) {
                    replyWorst = chess.in_checkmate() ? 99999 : 0;
                } else {
                    for (const om of oppMoves) {
                        chess.move(om);
                        const s = evaluateBoard() + (Math.random() * 12 - 6);
                        if (s < replyWorst) replyWorst = s;
                        chess.undo();
                    }
                }
                chess.undo();
                if (m.captured) replyWorst += 22;
                if (replyWorst > bestScore) { bestScore = replyWorst; bestMove = m; }
            }
            const executed = chess.move(bestMove);
            if (executed) executeAnimatedMove(executed);
        }

        /***********************************************************************
         * 8. INPUT — MOUSE / TOUCH / KEYBOARD / GAMEPAD + CURSOR & FX
         ***********************************************************************/
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let pointerDownPos = { x: 0, y: 0 };

        // ---- Console visuals: square cursor, selection beam, rose-window light shafts ----
        const cursor = { c: 4, r: 6 };
        const cursorSquare = () => `${FILES[cursor.c]}${8 - cursor.r}`;
        const cursorMesh = (() => {
            const g = new THREE.RingGeometry(0.64, 0.78, 4, 1, Math.PI / 4);
            g.rotateX(-Math.PI / 2);
            const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
            m.position.y = 0.035; m.visible = false; scene.add(m);
            return m;
        })();
        const beamMesh = (() => {
            const m = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.5, 1.8, 32, 1, true), new THREE.MeshBasicMaterial({
