                color: 0xfbbf24, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
            m.visible = false; scene.add(m);
            return m;
        })();
        const lightShafts = [];
        (() => {
            const mat = new THREE.MeshBasicMaterial({ color: 0x7c93ff, transparent: true, opacity: 0.04, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
            [-1, 0, 1].forEach(i => {
                const from = new THREE.Vector3(i * 3.2, 13, -30), to = new THREE.Vector3(i * 1.6, -0.5, i === 0 ? 0.5 : 2.5);
                const len = from.distanceTo(to);
                const m = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 3.4, len, 24, 1, true), mat.clone());
                m.position.copy(from).add(to).multiplyScalar(0.5);
                m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), from.clone().sub(to).normalize());
                scene.add(m);
                lightShafts.push(m);
            });
        })();

        let inputMode = 'mouse';
        function setInputMode(m) {
            if (inputMode === m) return;
            inputMode = m;
            renderLegend();
            updateCursorVisual();
        }
        function updateCursorVisual() {
            cursorMesh.visible = inputMode !== 'mouse' && !titleOpen;
            cursorMesh.position.copy(squareToWorld(cursorSquare())).setY(0.035);
        }
        function moveCursor(dir) {
            const dx = dir === 'left' ? -1 : dir === 'right' ? 1 : 0;
            const dy = dir === 'up' ? 1 : dir === 'down' ? -1 : 0;
            const th = cameraControl.theta;
            const wx = dx * Math.cos(th) - dy * Math.sin(th);
            const wz = -dx * Math.sin(th) - dy * Math.cos(th);
            if (Math.abs(wx) >= Math.abs(wz)) cursor.c = Math.max(0, Math.min(7, cursor.c + Math.sign(wx)));
            else cursor.r = Math.max(0, Math.min(7, cursor.r + Math.sign(wz)));
            soundFX.playSelect();
            updateCursorVisual();
        }

        function onPointerDown(e) {
            const p = e.touches ? e.touches[0] : e;
            pointerDownPos = { x: p.clientX, y: p.clientY };
            cameraControl.isDragging = true;
            cameraControl.previousMousePosition = { x: p.clientX, y: p.clientY };
        }
        function onPointerMove(e) {
            if (!cameraControl.isDragging) return;
            const p = e.touches ? e.touches[0] : e;
            cameraControl.targetTheta -= (p.clientX - cameraControl.previousMousePosition.x) * 0.0065;
            cameraControl.targetPhi -= (p.clientY - cameraControl.previousMousePosition.y) * 0.0055;
            cameraControl.previousMousePosition = { x: p.clientX, y: p.clientY };
        }
        function onPointerUp(e) {
            if (!cameraControl.isDragging) return;
            cameraControl.isDragging = false;
            const p = e.changedTouches ? e.changedTouches[0] : e;
            if (Math.hypot(p.clientX - pointerDownPos.x, p.clientY - pointerDownPos.y) < 6) {
                setInputMode(e.changedTouches ? 'touch' : 'mouse');
                const sq = pickSquare(p.clientX, p.clientY);
                if (sq) { cursor.c = FILES.indexOf(sq[0]); cursor.r = 8 - parseInt(sq[1], 10); }
                handleSquare(sq);
            }
        }

        function pickSquare(clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const pieceHits = raycaster.intersectObjects(Object.values(pieceMeshes), true);
            if (pieceHits.length) {
                let obj = pieceHits[0].object;
                while (obj && !obj.userData.square && obj.parent) obj = obj.parent;
                if (obj && obj.userData.square) return obj.userData.square;
            }
            const tileHits = raycaster.intersectObjects(tileMeshes, false);
            return tileHits.length ? tileHits[0].object.userData.square : null;
        }

        function handleSquare(clickedSquare) {
            if (titleOpen || modalState || isAnimating || isGameOver()) return;
            if (playVsAI && currentTurn() === 'b') return;
            if (!clickedSquare) { selectedSquare = null; legalMovesForSelected = []; clearHighlights(); return; }

            const matchingMove = legalMovesForSelected.find(m => m.to === clickedSquare);
            if (selectedSquare && matchingMove) {
                if (isChess()) {
                    if (matchingMove.flags.includes('p')) {
                        pendingPromotionMove = { from: selectedSquare, to: clickedSquare };
                        openPromotionModal();
                        return;
                    }
                    const res = chess.move({ from: selectedSquare, to: clickedSquare });
                    selectedSquare = null; legalMovesForSelected = [];
                    if (res) executeAnimatedMove(res);
                } else {
                    const res = checkers.move(matchingMove);
                    selectedSquare = null; legalMovesForSelected = [];
                    executeCheckersMove(res);
                }
                return;
            }

            const pieceOnSquare = isChess() ? chess.get(clickedSquare) : checkers.get(clickedSquare);
            if (pieceOnSquare && pieceOnSquare.color === currentTurn()) {
                selectedSquare = clickedSquare;
                legalMovesForSelected = isChess()
                    ? chess.moves({ square: clickedSquare, verbose: true })
                    : checkers.moves({ square: clickedSquare });
                soundFX.playSelect();
                showHighlightsForSquare(clickedSquare);
            } else {
                selectedSquare = null; legalMovesForSelected = [];
                clearHighlights();
            }
        }

        const domElem = renderer.domElement;
        domElem.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        domElem.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp, { passive: true });
        domElem.addEventListener('wheel', (e) => { e.preventDefault(); cameraControl.targetRadius += e.deltaY * 0.012; }, { passive: false });

        // ---- Unified action dispatcher (keyboard + gamepad) ----
        function handleAction(a) {
            if (titleOpen) return titleAction(a);
            if (modalState === 'promo') return promoAction(a);
            if (modalState === 'over') return overAction(a);
            switch (a) {
                case 'up': case 'down': case 'left': case 'right': moveCursor(a); break;
                case 'confirm': handleSquare(cursorSquare()); break;
                case 'back':
                    if (selectedSquare) { selectedSquare = null; legalMovesForSelected = []; clearHighlights(); }
                    else openTitle();
                    break;
                case 'demo': triggerDemoKnockDown(); break;
                case 'cam': cameraControl.cyclePreset(); break;
                case 'rotL': cameraControl.targetTheta += Math.PI / 4; break;
                case 'rotR': cameraControl.targetTheta -= Math.PI / 4; break;
                case 'chess': setGameMode('chess'); break;
                case 'checkers': setGameMode('checkers'); break;
                case 'swap': setGameMode(isChess() ? 'checkers' : 'chess'); break;
                case 'undo': doUndo(); break;
                case 'restart': newGame(); break;
                case 'menu': openTitle(); break;
            }
        }

        const KEYMAP = {
            ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down',
            ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
            Enter: 'confirm', ' ': 'confirm', Escape: 'back', Backspace: 'back',
            x: 'demo', X: 'demo', c: 'cam', C: 'cam', q: 'rotL', Q: 'rotL', e: 'rotR', E: 'rotR',
            z: 'undo', Z: 'undo', Tab: 'swap', n: 'restart', N: 'restart', m: 'menu', M: 'menu'
        };
        window.addEventListener('keydown', (e) => {
            if (modalState === 'promo' && '1234'.includes(e.key) && e.key.length === 1) { choosePromotion(['q', 'r', 'b', 'n'][+e.key - 1]); return; }
            const a = KEYMAP[e.key];
            if (!a) return;
            e.preventDefault();
            if (['up', 'down', 'left', 'right', 'confirm'].includes(a) && !titleOpen && !modalState) setInputMode('keys');
            handleAction(a);
        });

        // ---- Gamepad (standard mapping) ----
        const PAD_BTN = { 0: 'confirm', 1: 'back', 2: 'demo', 3: 'cam', 4: 'chess', 5: 'checkers', 8: 'undo', 9: 'menu', 12: 'up', 13: 'down', 14: 'left', 15: 'right' };
        const padPrev = {};
        const stickRepeat = { dir: null, t: 0 };
        window.addEventListener('gamepadconnected', () => { setInputMode('pad'); showCombatTelemetry('CONTROLLER', '', 1000, true); });
        function pollGamepad(dt) {
            const pads = navigator.getGamepads ? navigator.getGamepads() : [];
            const gp = pads && [...pads].find(p => p && p.connected);
            if (!gp) return;
            for (const [i, act] of Object.entries(PAD_BTN)) {
                const pressed = !!(gp.buttons[i] && gp.buttons[i].pressed);
                if (pressed && !padPrev[i]) {
                    setInputMode('pad');
                    if (titleOpen && act === 'cam') toggleAIFromMenu();
                    else if (titleOpen && act === 'menu') titleAction(gameStarted ? 'back' : 'confirm');
                    else handleAction(act);
                }
                padPrev[i] = pressed;
            }
            // Left stick → cursor with auto-repeat
            const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
            let dir = null;
            if (Math.abs(ax) > 0.55 || Math.abs(ay) > 0.55) dir = Math.abs(ax) > Math.abs(ay) ? (ax > 0 ? 'right' : 'left') : (ay > 0 ? 'down' : 'up');
            if (dir) {
                if (dir !== stickRepeat.dir) { stickRepeat.dir = dir; stickRepeat.t = 0.32; setInputMode('pad'); handleAction(dir); }
                else if ((stickRepeat.t -= dt) <= 0) { stickRepeat.t = 0.14; handleAction(dir); }
            } else stickRepeat.dir = null;
            // Right stick → orbit, triggers → zoom
            const rx = gp.axes[2] || 0, ry = gp.axes[3] || 0;
            if (Math.abs(rx) > 0.15) cameraControl.targetTheta -= rx * dt * 2.4;
            if (Math.abs(ry) > 0.15) cameraControl.targetPhi += ry * dt * 1.6;
            const lt = gp.buttons[6] ? gp.buttons[6].value : 0, rt = gp.buttons[7] ? gp.buttons[7].value : 0;
            cameraControl.targetRadius += (lt - rt) * dt * 14;
        }

        /***********************************************************************
         * 9. UI — HUD, TITLE MENU, MODALS
         ***********************************************************************/
        const btnUndo = document.getElementById('btn-undo');
        const capturedByWhiteEl = document.getElementById('captured-by-white');
        const capturedByBlackEl = document.getElementById('captured-by-black');
        const plateW = document.getElementById('plate-w');
        const plateB = document.getElementById('plate-b');
        const statusChip = document.getElementById('status-chip');
        const hudEl = document.getElementById('hud');
        const titleEl = document.getElementById('title-screen');
        const legendEl = document.getElementById('legend');

        const chessGlyph = { p: '♟', n: '♞', b: '♝', r: '♜', q: '♛', k: '♚' };
        const checkerGlyph = { w: { c: '⛀', k: '⛁' }, b: { c: '⛂', k: '⛃' } };
        const sideLabel = (c) => (c === 'w' ? 'P1' : (playVsAI ? 'CPU' : 'P2'));

        function setChip(text, cls) {
            if (!text) { statusChip.className = 'chip hidden'; return; }
            statusChip.className = 'chip ' + cls;
            statusChip.textContent = text;
        }

        function renderLegend() {
            const L = {
                mouse: '<span><span class="ms">mouse</span>SELECT</span><span><span class="ms">3d_rotation</span>ORBIT</span><span><span class="ms">zoom_in</span>ZOOM</span><span><span class="kc">←↑↓→</span>KEYS</span>',
                touch: '<span><span class="ms">touch_app</span>SELECT</span><span><span class="ms">swipe</span>ORBIT</span>',
                keys: '<span><span class="kc">←↑↓→</span>MOVE</span><span><span class="kc">ENTER</span>SELECT</span><span><span class="kc">ESC</span>BACK</span><span><span class="kc">Q E</span>ORBIT</span><span><span class="kc">TAB</span>GAME</span>',
                pad: '<span><span class="pb a">A</span>SELECT</span><span><span class="pb b">B</span>BACK</span><span><span class="pb x">X</span>DEMO</span><span><span class="pb y">Y</span>CAM</span><span><span class="kc">LB RB</span>GAME</span>'
            };
            legendEl.innerHTML = L[inputMode] || L.mouse;
            document.getElementById('press-hint').innerHTML = inputMode === 'pad'
                ? '<span class="pb a">A</span> START &nbsp; <span class="pb y">Y</span> 1P/2P'
                : '<span class="kc">ENTER</span> START &nbsp; <span class="kc">M</span> 1P/2P';
        }

        function updateUI() {
            const turn = currentTurn();
            const history = moveHistory();
            const over = isGameOver();
            btnUndo.disabled = history.length === 0 || isAnimating;
            plateW.classList.toggle('active', turn === 'w' && !over);
            plateB.classList.toggle('active', turn === 'b' && !over);
            plateB.classList.toggle('thinking', playVsAI && turn === 'b' && !over);
            document.getElementById('p2-label').textContent = playVsAI ? 'CPU' : 'P2';

            if (isChess()) {
                if (chess.in_checkmate()) { setChip('MATE', 'red'); showGameOverModal('CHECKMATE', turn === 'w' ? 'b' : 'w'); }
                else if (chess.game_over()) { setChip('DRAW', 'amber'); showGameOverModal('DRAW', 'd'); }
                else if (chess.in_check()) setChip('CHECK', 'red');
                else setChip(null);
            } else {
                if (!checkers.hasMoves()) { setChip('WIN', 'amber'); showGameOverModal('VICTORY', turn === 'w' ? 'b' : 'w'); }
                else if (checkers.isDraw()) { setChip('DRAW', 'amber'); showGameOverModal('DRAW', 'd'); }
                else if (checkers.mustCapture()) setChip('JUMP!', 'red');
                else setChip(null);
            }

            const whiteSpoils = [], blackSpoils = [];
            history.forEach(m => {
                if (!m.captured) return;
                (Array.isArray(m.captured) ? m.captured : [m.captured]).forEach(t => (m.color === 'w' ? whiteSpoils : blackSpoils).push(t));
            });
            const glyph = (t, victimColor) => (isChess() ? chessGlyph[t] : checkerGlyph[victimColor][t]);
            const order = { q: 1, r: 2, b: 3, n: 4, k: 0, c: 5, p: 5 };
            whiteSpoils.sort((a, b) => order[a] - order[b]);
            blackSpoils.sort((a, b) => order[a] - order[b]);
            capturedByWhiteEl.textContent = whiteSpoils.map(p => glyph(p, 'b')).join('');
            capturedByBlackEl.textContent = blackSpoils.map(p => glyph(p, 'w')).join('');
        }

        // ---- Modals ----
        const modalOverlay = document.getElementById('modal-overlay');
        const promotionCard = document.getElementById('promotion-card');
        const gameoverCard = document.getElementById('gameover-card');
        const promoBtns = [...document.querySelectorAll('.promo-btn')];
        let promoIdx = 0;

        function openPromotionModal() {
            modalState = 'promo';
            promoIdx = 0;
            promoBtns.forEach((b, i) => b.classList.toggle('focus', i === 0));
            modalOverlay.classList.add('open');
            promotionCard.style.display = ''; gameoverCard.style.display = 'none';
        }
        function showGameOverModal(title, winner) {
            if (gameOverShown) return;
            gameOverShown = true;
            setTimeout(() => {
                if (!gameOverShown) return;
                modalState = 'over';
                document.getElementById('gameover-title').textContent = title;
                document.getElementById('gameover-subtitle').textContent = winner === 'd' ? 'NO WINNER' : sideLabel(winner) + ' WINS';
                document.getElementById('gameover-orb').className = 'orb ' + winner;
                modalOverlay.classList.add('open');
                promotionCard.style.display = 'none'; gameoverCard.style.display = '';
            }, 900);
        }
        function closeModal() { modalState = null; modalOverlay.classList.remove('open'); }

        function choosePromotion(type) {
            closeModal();
            if (!pendingPromotionMove) return;
            const res = chess.move({ from: pendingPromotionMove.from, to: pendingPromotionMove.to, promotion: type });
            pendingPromotionMove = null; selectedSquare = null; legalMovesForSelected = [];
            if (res) executeAnimatedMove(res);
        }
        promoBtns.forEach(btn => btn.addEventListener('click', () => choosePromotion(btn.dataset.promo)));
        function promoAction(a) {
            if (a === 'left' || a === 'right') {
                promoIdx = (promoIdx + (a === 'right' ? 1 : 3)) % 4;
                promoBtns.forEach((b, i) => b.classList.toggle('focus', i === promoIdx));
                soundFX.playSelect();
            } else if (a === 'confirm') choosePromotion(promoBtns[promoIdx].dataset.promo);
            else if (a === 'back') { pendingPromotionMove = null; closeModal(); }
        }
        function overAction(a) {
            if (a === 'confirm' || a === 'restart') newGame();
            else if (a === 'back') closeModal();
            else if (a === 'menu') { closeModal(); openTitle(); }
        }

        // ---- Game lifecycle ----
        let animEpoch = 0;
        function abortAnimations() {
            animEpoch++;
            activeAnimations.forEach(a => {
                [a.mesh, a.victimMesh, ...(a.victims || []).map(v => v.mesh)].forEach(m => { if (m) scene.remove(m); });
            });
            activeAnimations.length = 0;
            isAnimating = false;
            cameraControl.desiredLookAt.set(0, 0.4, 0);
        }

        function newGame() {
            clearTimeout(aiTimer);
            abortAnimations();
            closeModal();
            chess.reset();
            checkers.reset();
            selectedSquare = null; legalMovesForSelected = []; pendingPromotionMove = null;
            gameOverShown = false;
            cursor.c = 4; cursor.r = 6;
            syncBoardFromState();
            updateCursorVisual();
            soundFX.playSelect();
            if (!titleOpen) showCombatTelemetry(isChess() ? '♚ CHESS' : '⛂ CHECKERS', '', 1000, true);
        }

        function setGameMode(mode) {
            if (mode === gameMode) return;
            gameMode = mode;
            document.querySelectorAll('.game-tab').forEach(t => t.classList.toggle('active', t.dataset.game === mode));
            document.title = mode === 'chess' ? "Wizard's Chess · IONITY.FUN" : "Wizard's Checkers · IONITY.FUN";
            newGame();
            renderTitle();
        }

        function doUndo() {
            if (isAnimating) return;
            clearTimeout(aiTimer);
            const engine = isChess() ? chess : checkers;
            if (playVsAI && engine.turn() === 'w' && moveHistory().length >= 2) { engine.undo(); engine.undo(); }
            else engine.undo();
            selectedSquare = null; legalMovesForSelected = [];
            gameOverShown = false;
            closeModal();
            syncBoardFromState();
            soundFX.playMove();
            maybeTriggerAI();
        }

        function setAI(v) {
            playVsAI = v;
            document.getElementById('mode-icon').textContent = playVsAI ? 'smart_toy' : 'group';
            document.querySelectorAll('#t-mode button').forEach(b => b.classList.toggle('active', (b.dataset.ai === '1') === playVsAI));
            clearHighlights();
            updateUI();
            if (!isAnimating && !titleOpen) maybeTriggerAI();
        }
        function toggleAIFromMenu() { setAI(!playVsAI); soundFX.playSelect(); }

        // ---- Title / pause menu ----
        let titleOpen = true, titleFocus = 'chess', gameStarted = false;
        function renderTitle() {
            document.querySelectorAll('.tile').forEach(t => {
                t.classList.toggle('focus', t.dataset.game === titleFocus);
                t.classList.toggle('current', gameStarted && t.dataset.game === gameMode);
            });
        }
        function openTitle() {
            titleOpen = true;
            titleFocus = gameMode;
            renderTitle();
            titleEl.classList.remove('off');
            hudEl.classList.add('off');
            updateCursorVisual();
        }
        function closeTitle() {
            titleOpen = false;
            titleEl.classList.add('off');
            hudEl.classList.remove('off');
            cameraControl.targetTheta = Math.round(cameraControl.theta / (Math.PI * 2)) * Math.PI * 2;
            updateCursorVisual();
        }
        function startFromTitle(game) {
            soundFX.init();
            if (game !== gameMode) setGameMode(game);
            else if (!gameStarted) newGame();
            gameStarted = true;
            closeTitle();
            soundFX.playCrown();
            showCombatTelemetry(isChess() ? '♚ CHESS' : '⛂ CHECKERS', '', 1100, true);
            maybeTriggerAI();
        }
        function titleAction(a) {
            if (a === 'left' || a === 'right' || a === 'chess' || a === 'checkers' || a === 'swap') {
                titleFocus = a === 'chess' ? 'chess' : a === 'checkers' ? 'checkers' : (titleFocus === 'chess' ? 'checkers' : 'chess');
                renderTitle(); soundFX.playSelect();
            } else if (a === 'up' || a === 'down' || a === 'menu') toggleAIFromMenu();
            else if (a === 'confirm') startFromTitle(titleFocus);
            else if (a === 'back' && gameStarted) closeTitle();
        }
        document.querySelectorAll('.tile').forEach(t => {
            t.addEventListener('mouseenter', () => { titleFocus = t.dataset.game; renderTitle(); });
            t.addEventListener('click', () => startFromTitle(t.dataset.game));
        });
        document.querySelectorAll('#t-mode button').forEach(b => b.addEventListener('click', () => { setAI(b.dataset.ai === '1'); soundFX.playSelect(); }));

        // ---- HUD buttons ----
        document.querySelectorAll('.game-tab').forEach(t => t.addEventListener('click', () => setGameMode(t.dataset.game)));
        document.getElementById('btn-new').addEventListener('click', newGame);
        document.getElementById('btn-modal-new').addEventListener('click', newGame);
        document.getElementById('btn-modal-close').addEventListener('click', closeModal);
        document.getElementById('btn-modal-menu').addEventListener('click', () => { closeModal(); openTitle(); });
        document.getElementById('btn-menu').addEventListener('click', openTitle);
        document.getElementById('btn-undo').addEventListener('click', doUndo);
        document.getElementById('btn-demo').addEventListener('click', triggerDemoKnockDown);
        document.getElementById('btn-camera').addEventListener('click', () => { cameraControl.cyclePreset(); soundFX.playSelect(); });
        document.getElementById('btn-mode').addEventListener('click', () => toggleAIFromMenu());
        document.getElementById('btn-sound').addEventListener('click', () => {
            soundFX.enabled = !soundFX.enabled;
            document.getElementById('sound-icon').textContent = soundFX.enabled ? 'volume_up' : 'volume_off';
            document.getElementById('btn-sound').classList.toggle('on', !soundFX.enabled);
        });
        document.getElementById('btn-actioncam').addEventListener('click', () => {
            useActionCam = !useActionCam;
            document.getElementById('actioncam-icon').textContent = useActionCam ? 'videocam' : 'videocam_off';
            document.getElementById('btn-actioncam').classList.toggle('on', useActionCam);
        });
        renderLegend();

        /***********************************************************************
         * 10. MAIN LOOP
         ***********************************************************************/
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            const elapsedTime = clock.getElapsedTime();

            pollGamepad(dt);
            if (titleOpen) cameraControl.targetTheta += dt * 0.12;
            cameraControl.update(dt);

            // Console FX: cursor pulse, selection beam, marker breathing, light shafts
            if (cursorMesh.visible) {
                cursorMesh.material.opacity = 0.55 + Math.sin(elapsedTime * 6) * 0.35;
                cursorMesh.material.color.setHex(selectedSquare ? 0xfbbf24 : 0x00f0ff);
            }
            beamMesh.visible = !!selectedSquare && !isAnimating;
            if (beamMesh.visible) {
                beamMesh.position.copy(squareToWorld(selectedSquare)).setY(0.9);
                beamMesh.material.opacity = 0.16 + Math.sin(elapsedTime * 4) * 0.06;
                beamMesh.rotation.y = elapsedTime;
            }
            const pulse = 1 + Math.sin(elapsedTime * 5) * 0.08;
            Object.values(highlightMeshes).forEach(h => { if (h.group.visible) h.ring.scale.setScalar(pulse); });
            lightShafts.forEach((m, i) => { m.material.opacity = 0.03 + Math.sin(elapsedTime * 0.6 + i * 1.7) * 0.015; });

            vblocksHolos.forEach(h => {
                h.group.rotation.y = elapsedTime * 0.85 + h.basePhase;
                h.group.position.y = 1.22 + Math.sin(elapsedTime * 2.4 + h.basePhase) * 0.08;
            });
            if (centerMedallionMesh) centerMedallionMesh.material.opacity = 0.84 + Math.sin(elapsedTime * 2.5) * 0.1;
            brazierLights.forEach((light, idx) => { light.intensity = 1.05 + Math.sin(elapsedTime * 7 + idx * 2.1) * 0.15; });

            const posAttr = dustGeo.attributes.position;
            for (let i = 0; i < dustCount; i++) {
                let y = posAttr.getY(i) + dt * 0.22;
                if (y > 16) y = 0.2;
                posAttr.setY(i, y);
            }
            posAttr.needsUpdate = true;

            Object.values(pieceMeshes).forEach(mesh => {
                const phase = mesh.userData.phase || 0;
                const isSelected = mesh.userData.square === selectedSquare;
                if (!isAnimating) {
                    const targetHover = isSelected ? 0.22 + Math.sin(elapsedTime * 5) * 0.05 : Math.sin(elapsedTime * 2.2 + phase) * 0.025;
                    mesh.position.y += (Math.max(0, targetHover) - mesh.position.y) * 0.15;
                }
                if (mesh.userData.floatingGem) mesh.userData.floatingGem.rotation.y = elapsedTime * 1.8 + phase;
            });

            for (let i = activeAnimations.length - 1; i >= 0; i--) {
                const anim = activeAnimations[i];
                anim.elapsed += dt;
                const t = Math.min(1, anim.elapsed / anim.duration);
                const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

                if (anim.type === 'slide') {
                    anim.mesh.position.lerpVectors(anim.startPos, anim.endPos, ease);
                    anim.mesh.position.y = Math.sin(t * Math.PI) * 0.14;
                } else if (anim.type === 'leap') {
                    anim.mesh.position.lerpVectors(anim.startPos, anim.endPos, ease);
                    anim.mesh.position.y = Math.sin(t * Math.PI) * 1.35;
                    anim.mesh.rotation.x = Math.sin(t * Math.PI * 2) * 0.28;
                } else if (anim.type === 'checker_jumps') {
                    // Each hop: piece vaults over the victim; victim is struck, tips over, skids and shatters
                    const segCount = anim.points.length - 1;
                    const segF = Math.min(segCount - 1e-6, t * segCount);
                    const seg = Math.floor(segF);
                    const lt = segF - seg;
                    const le = lt < 0.5 ? 2 * lt * lt : 1 - Math.pow(-2 * lt + 2, 2) / 2;
                    anim.mesh.position.lerpVectors(anim.points[seg], anim.points[seg + 1], le);
                    anim.mesh.position.y = Math.sin(lt * Math.PI) * 0.95;
                    anim.mesh.rotation.y = (seg + le) * Math.PI;

                    anim.victims.forEach((v, vi) => {
                        if (vi < seg) { shatterCheckerVictim(v); return; }
                        if (vi !== seg || v.shattered) return;
                        if (lt >= 0.35 && !v.hit) {
                            v.hit = true;
                            soundFX.playKnockdownHit();
                            cameraControl.triggerShake(0.25);
                            spawnImpactPlume(v.pos, 0x38bdf8, 12);
                        }
                        if (v.hit && v.mesh) {
                            const kd = Math.min(1, (lt - 0.35) / 0.32);
                            v.mesh.position.copy(v.pos).addScaledVector(v.dir, kd * 0.45);
                            v.mesh.position.y = Math.sin(kd * Math.PI) * 0.18;
                            v.mesh.setRotationFromAxisAngle(v.axis, kd * kd * Math.PI * 0.5);
                            if (kd >= 1) shatterCheckerVictim(v);
                        }
                    });
                    if (t >= 1) anim.victims.forEach(shatterCheckerVictim);
                } else if (anim.type === 'attack_knockdown') {
                    // Stage 1 wind-up -> Stage 2 charge -> Stage 3 knock-down -> Stage 4 ground-slam shatter
                    if (t < 0.18) {
                        const windT = t / 0.18;
                        anim.mesh.position.copy(anim.startPos).addScaledVector(anim.impactDir, -0.28 * Math.sin(windT * Math.PI * 0.5));
                        anim.mesh.position.y = windT * 0.22;
                        anim.mesh.setRotationFromAxisAngle(anim.toppleAxis, -windT * 0.38);
                    } else if (t < 0.38) {
                        const chargeT = (t - 0.18) / 0.20;
                        const chargeEase = chargeT * chargeT;
                        const strikePoint = anim.endPos.clone().addScaledVector(anim.impactDir, -0.32);
                        anim.mesh.position.lerpVectors(anim.startPos, strikePoint, chargeEase);
                        anim.mesh.position.y = Math.sin(chargeT * Math.PI) * 0.55;
                        anim.mesh.setRotationFromAxisAngle(anim.toppleAxis, -0.38 + chargeEase * 0.92);
                    } else if (t < 0.78) {
                        if (!anim.hitTriggered) {
                            anim.hitTriggered = true;
                            soundFX.playKnockdownHit();
                            cameraControl.triggerShake(0.32);
                            spawnImpactPlume(anim.endPos, 0x38bdf8, 16);
                        }
                        const kdT = (t - 0.38) / 0.40;
                        const strikePoint = anim.endPos.clone().addScaledVector(anim.impactDir, -0.32);
                        const advancePoint = anim.endPos.clone().addScaledVector(anim.impactDir, -0.08);
                        anim.mesh.position.lerpVectors(strikePoint, advancePoint, kdT);
                        anim.mesh.position.y = Math.max(0, (1 - kdT) * 0.15);
                        anim.mesh.setRotationFromAxisAngle(anim.toppleAxis, (1 - kdT) * 0.45);
                        if (anim.victimMesh && kdT < 0.08) {
                            // Hit-stop: defender shudders violently before losing balance
                            anim.victimMesh.position.copy(anim.victimStartPos);
                            anim.victimMesh.position.x += (Math.random() - 0.5) * 0.12;
                            anim.victimMesh.position.z += (Math.random() - 0.5) * 0.12;
                        } else if (anim.victimMesh) {
                            const kd = (kdT - 0.08) / 0.92;
                            const skidDist = (1 - Math.pow(1 - kd, 2)) * 0.68;
                            anim.victimMesh.position.copy(anim.victimStartPos).addScaledVector(anim.impactDir, skidDist);
                            anim.victimMesh.position.y = kd < 0.3
                                ? Math.sin((kd / 0.3) * Math.PI) * 0.22
                                : Math.abs(Math.sin((kd - 0.3) * Math.PI * 2.5)) * 0.08 * (1 - kd);
                            anim.victimMesh.setRotationFromAxisAngle(anim.toppleAxis, Math.pow(kd, 1.65) * (Math.PI * 0.49));
                        }
                    } else {
                        if (!anim.shattered) {
                            anim.shattered = true;
                            soundFX.playGroundSlamAndShatter();
                            cameraControl.triggerShake(0.55);
                            const slamPos = anim.endPos.clone();
                            if (anim.victimMesh) slamPos.copy(anim.victimMesh.position);
                            spawnKnockdownFracture(slamPos, anim.victimColor, anim.impactDir, false, anim.victimMesh);
                            if (anim.victimMesh) {
                                scene.remove(anim.victimMesh);
                                if (pieceMeshes[anim.victimSq] === anim.victimMesh) delete pieceMeshes[anim.victimSq];
                            }
                        }
                        const settleT = (t - 0.78) / 0.22;
                        const advancePoint = anim.endPos.clone().addScaledVector(anim.impactDir, -0.08);
                        anim.mesh.position.lerpVectors(advancePoint, anim.endPos, settleT);
                        anim.mesh.position.y = 0;
                        anim.mesh.rotation.set(0, 0, 0);
                    }
                }

                if (t >= 1) {
                    activeAnimations.splice(i, 1);
                    if (anim.onDone) anim.onDone();
                }
            }

            updateParticlesAndEffects(dt);
            renderer.render(scene, camera);
        }

        function fitCamera() {
            camera.aspect = window.innerWidth / window.innerHeight;
            // Portrait screens: widen vertical FOV so the whole board stays in frame
            camera.fov = camera.aspect < 1 ? Math.max(45, 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(19)) / camera.aspect) * 180 / Math.PI) : 45;
            camera.updateProjectionMatrix();
        }
        fitCamera();
        window.addEventListener('resize', () => {
            fitCamera();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.addEventListener('load', () => {
            syncBoardFromState();
            renderTitle();
            animate();
        });

        // Test/automation hook
        window.__arena = { handleAction, startFromTitle, handleSquare, triggerDemoKnockDown, chess, checkers, setGameMode, newGame, triggerAutomatonMove, executeCheckersMove, executeAnimatedMove, get state() { return { gameMode, isAnimating, playVsAI, pieces: Object.keys(pieceMeshes).length }; } };
    </script>
</body>
