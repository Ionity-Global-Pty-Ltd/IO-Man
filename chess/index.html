    <script>
        /* 1. WEB AUDIO SYNTHESIZER */
        class CathedralAudioEngine {
            constructor() { this.ctx = null; this.enabled = true; }
            init() { if (!this.ctx) { const AudioCtx = window.AudioContext || window.webkitAudioContext; if (AudioCtx) this.ctx = new AudioCtx(); } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
            toggle() { this.enabled = !this.enabled; return this.enabled; }
            playSelect() {
                if (!this.enabled) return; this.init(); if (!this.ctx) return;
                const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(520, now); osc.frequency.exponentialRampToValueAtTime(780, now + 0.14);
                gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.17);
            }
            playStoneSlide(duration = 0.42) {
                if (!this.enabled) return; this.init(); if (!this.ctx) return;
                const now = this.ctx.currentTime, bufferSize = this.ctx.sampleRate * duration, buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate), data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.45;
                const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.setValueAtTime(160, now); filter.frequency.linearRampToValueAtTime(240, now + duration * 0.7); filter.Q.value = 3.2;
                const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.01, now); gain.gain.linearRampToValueAtTime(0.14, now + 0.06); gain.gain.linearRampToValueAtTime(0.08, now + duration - 0.06); gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination); noise.start(now);
                setTimeout(() => this.playStoneSettle(), (duration - 0.05) * 1000);
            }
            playStoneSettle() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(115, now); osc.frequency.exponentialRampToValueAtTime(38, now + 0.14);
                gain.gain.setValueAtTime(0.24, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.16);
            }
            playKnockdownStrike() {
                if (!this.enabled) return; this.init(); if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const sub = this.ctx.createOscillator(), subGain = this.ctx.createGain();
                sub.type = 'sawtooth'; sub.frequency.setValueAtTime(150, now); sub.frequency.exponentialRampToValueAtTime(32, now + 0.28);
                subGain.gain.setValueAtTime(0.42, now); subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.30);
                sub.connect(subGain); subGain.connect(this.ctx.destination); sub.start(now); sub.stop(now + 0.31);
                const crackOsc = this.ctx.createOscillator(), crackGain = this.ctx.createGain();
                crackOsc.type = 'square'; crackOsc.frequency.setValueAtTime(920, now); crackOsc.frequency.exponentialRampToValueAtTime(180, now + 0.09);
                crackGain.gain.setValueAtTime(0.22, now); crackGain.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
                crackOsc.connect(crackGain); crackGain.connect(this.ctx.destination); crackOsc.start(now); crackOsc.stop(now + 0.11);
            }
            playGroundSlamAndShatter() {
                if (!this.enabled) return; this.init(); if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const slamOsc = this.ctx.createOscillator(), slamGain = this.ctx.createGain();
                slamOsc.type = 'sine'; slamOsc.frequency.setValueAtTime(95, now); slamOsc.frequency.exponentialRampToValueAtTime(22, now + 0.48);
                slamGain.gain.setValueAtTime(0.55, now); slamGain.gain.exponentialRampToValueAtTime(0.001, now + 0.50);
                slamOsc.connect(slamGain); slamGain.connect(this.ctx.destination); slamOsc.start(now); slamOsc.stop(now + 0.52);
                [0.0, 0.04, 0.09, 0.16, 0.24, 0.34].forEach((offset, idx) => {
                    const bTime = now + offset, dur = 0.12 + Math.random() * 0.1, bufferSize = Math.floor(this.ctx.sampleRate * dur), buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate), data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.4));
                    const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
                    const filter = this.ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 500 + idx * 260 + Math.random() * 300; filter.Q.value = 2.0;
                    const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.28 / (1 + idx * 0.25), bTime); gain.gain.exponentialRampToValueAtTime(0.001, bTime + dur);
                    noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination); noise.start(bTime);
                });
            }
        }

        function createTileTexture(isLight, fileIdx, rankIdx) {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256; const ctx = canvas.getContext('2d');
            if (isLight) {
                const grad = ctx.createLinearGradient(0, 0, 256, 256); grad.addColorStop(0, '#eef2f7'); grad.addColorStop(0.5, '#dde5f0'); grad.addColorStop(1, '#cbd5e1'); ctx.fillStyle = grad; ctx.fillRect(0, 0, 256, 256);
                ctx.strokeStyle = 'rgba(100, 116, 139, 0.22)'; ctx.lineWidth = 2;
                for (let v = 0; v < 5; v++) { ctx.beginPath(); ctx.moveTo((fileIdx * 37 + v * 60) % 256, 0); ctx.bezierCurveTo(80, 90, 170, 160, (rankIdx * 53 + v * 75) % 256, 256); ctx.stroke(); }
            } else {
                const grad = ctx.createLinearGradient(0, 0, 256, 256); grad.addColorStop(0, '#111622'); grad.addColorStop(0.5, '#0b0f19'); grad.addColorStop(1, '#161f30'); ctx.fillStyle = grad; ctx.fillRect(0, 0, 256, 256);
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.12)'; ctx.lineWidth = 1.5;
                for (let v = 0; v < 4; v++) { ctx.beginPath(); ctx.moveTo(0, (fileIdx * 43 + v * 65) % 256); ctx.quadraticCurveTo(128, 128, 256, (rankIdx * 61 + v * 50) % 256); ctx.stroke(); }
            }
            ctx.strokeStyle = isLight ? 'rgba(15, 23, 42, 0.18)' : 'rgba(0, 240, 255, 0.22)'; ctx.lineWidth = 6; ctx.strokeRect(4, 4, 248, 248);
            ctx.font = '700 16px "JetBrains Mono", monospace'; ctx.fillStyle = isLight ? 'rgba(15, 23, 42, 0.22)' : 'rgba(0, 240, 255, 0.25)'; ctx.fillText('VBLOCKS', 16, 238);
            const tex = new THREE.CanvasTexture(canvas); tex.anisotropy = 4; return tex;
        }

        function createCenterVBlocksMedallionTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 1024; const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 1024, 1024); const cx = 512, cy = 512;
            const radGrad = ctx.createRadialGradient(cx, cy, 60, cx, cy, 490);

            ctx.fillStyle = radGrad; ctx.beginPath(); ctx.arc(cx, cy, 490, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 10; ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 24; ctx.beginPath(); ctx.arc(cx, cy, 440, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 5; ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(cx, cy, 405, 0, Math.PI * 2); ctx.stroke();
            ctx.save(); ctx.strokeStyle = 'rgba(0, 240, 255, 0.35)'; ctx.lineWidth = 18; ctx.beginPath(); ctx.moveTo(260, 250); ctx.lineTo(512, 770); ctx.lineTo(764, 250); ctx.stroke(); ctx.restore();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 28; ctx.fillStyle = '#ffffff'; ctx.font = '900 132px "Inter", sans-serif'; ctx.fillText('VBLOCKS', cx, cy - 35);

            activeCombatSequence = { stage: 'CHARGE', elapsed: 0, attackerMesh, defenderMesh, fromPos: new THREE.Vector3(fromPos.x, 0, fromPos.z), toPos: new THREE.Vector3(toPos.x, 0, toPos.z), strikePoint, impactDir, tipAxis, tipAngle: 0, tipAngularVel: 2.15, skidDist: 0, strikeTriggered: false, shatterTriggered: false, onComplete };
        }
        function updateCombatAndPhysics(dt) {
            if (activeCombatSequence) {
                const seq = activeCombatSequence; seq.elapsed += dt;
                if (seq.stage === 'CHARGE') {
                    const t = Math.min(seq.elapsed / 0.34, 1);
                    if (t < 0.35) { const windT = t / 0.35; seq.attackerMesh.position.lerpVectors(seq.fromPos, seq.fromPos.clone().addScaledVector(seq.impactDir, -0.45), windT); seq.attackerMesh.userData.bodyPivot.rotation.x = -0.28 * windT; }
                    else { const lungeT = (t - 0.35) / 0.65, easeIn = lungeT * lungeT * (2.5 - 1.5 * lungeT); seq.attackerMesh.position.lerpVectors(seq.fromPos.clone().addScaledVector(seq.impactDir, -0.45), seq.strikePoint, easeIn); seq.attackerMesh.userData.bodyPivot.rotation.x = 0.42 * Math.sin(lungeT * Math.PI); }
                    if (t >= 1 && !seq.strikeTriggered) { seq.strikeTriggered = true; seq.stage = 'TOPPLE'; seq.elapsed = 0; audioFX.playKnockdownStrike(); camState.shakeIntensity = 0.38; spawnImpactSparks(seq.toPos.clone().add(new THREE.Vector3(0, 1.35, 0)), 0xffffff, 18); }
                } else if (seq.stage === 'TOPPLE') {
                    if (seq.elapsed < 0.055) { seq.defenderMesh.position.x = seq.toPos.x + (Math.random() - 0.5) * 0.22; seq.defenderMesh.position.z = seq.toPos.z + (Math.random() - 0.5) * 0.22; }
                    else {
                        seq.tipAngularVel += 24.5 * Math.sin(Math.max(seq.tipAngle, 0.22)) * dt; seq.tipAngle += seq.tipAngularVel * dt;
                        seq.skidDist = Math.min(seq.skidDist + 2.6 * dt, 0.72);
                        seq.defenderMesh.position.copy(seq.toPos).addScaledVector(seq.impactDir, seq.skidDist);
                        seq.defenderMesh.quaternion.setFromAxisAngle(seq.tipAxis, seq.tipAngle);
                        seq.defenderMesh.position.y = Math.sin(seq.tipAngle) * 0.38;
                    }
                    const settleT = Math.min(seq.elapsed / 0.44, 1); seq.attackerMesh.position.lerpVectors(seq.strikePoint, seq.toPos, settleT * 0.85); seq.attackerMesh.userData.bodyPivot.rotation.x *= 0.85;
                    if (seq.tipAngle >= Math.PI * 0.48 && !seq.shatterTriggered) { seq.shatterTriggered = true; seq.stage = 'SETTLE'; seq.elapsed = 0; audioFX.playGroundSlamAndShatter(); camState.shakeIntensity = 0.78; fractureToppledPiece(seq.defenderMesh, seq.impactDir); scene.remove(seq.defenderMesh); }
                } else if (seq.stage === 'SETTLE') {
                    const t = Math.min(seq.elapsed / 0.28, 1); seq.attackerMesh.position.lerp(seq.toPos, 0.25); seq.attackerMesh.userData.bodyPivot.rotation.x = 0; seq.attackerMesh.userData.bodyPivot.rotation.y = seq.attackerMesh.userData.baseFacing;
                    if (t >= 1) { seq.attackerMesh.position.copy(seq.toPos); const callback = seq.onComplete; activeCombatSequence = null; setTimeout(() => hideCombatTelemetry(), 900); if (callback) callback(); }
                }
            }
            for (let i = activeDebris.length - 1; i >= 0; i--) {
                const d = activeDebris[i]; d.life += dt; d.vel.y -= 19.8 * dt; d.mesh.position.addScaledVector(d.vel, dt);
                d.mesh.rotation.x += d.rotVel.x * dt; d.mesh.rotation.y += d.rotVel.y * dt; d.mesh.rotation.z += d.rotVel.z * dt;
                if (d.mesh.position.y < d.radius) { d.mesh.position.y = d.radius; d.vel.y = Math.abs(d.vel.y) > 1.2 ? -d.vel.y * d.bounce : 0; d.vel.x *= d.friction; d.vel.z *= d.friction; d.rotVel.multiplyScalar(0.85); }
                const lifeRatio = d.life / d.maxLife; if (lifeRatio > 0.75) { const fade = Math.max(0.001, 1 - (lifeRatio - 0.75) / 0.25); d.mesh.scale.multiplyScalar(0.94 + 0.05 * fade); }
                if (d.life >= d.maxLife) { scene.remove(d.mesh); activeDebris.splice(i, 1); }
            }
            for (let i = activeShockwaves.length - 1; i >= 0; i--) {
                const sw = activeShockwaves[i]; sw.age += dt; const p = sw.age / sw.maxAge, scale = 1 + p * 8.5; sw.mesh.scale.set(scale, scale, 1); sw.mesh.material.opacity = Math.max(0, (1 - p) * 0.85);
                if (p >= 1) { scene.remove(sw.mesh); activeShockwaves.splice(i, 1); }
            }
        }

        /* 6. CHESS LOGIC & AUTOMATON */
        const game = new Chess(); const pieceMeshes = {};
        let selectedSquare = null, legalMovesForSelected = [], vsAutomaton = true, isAnimating = false, moveFlight = null;
        const capturedPieces = { w: [], b: [] };
        const PIECE_SYMBOLS = { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚' };

        function syncBoardFromChessState() {
            Object.keys(pieceMeshes).forEach((sq) => { scene.remove(pieceMeshes[sq]); delete pieceMeshes[sq]; });
            const board = game.board();
            for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) { const cell = board[r][f]; if (cell) { const sq = String.fromCharCode(97 + f) + (8 - r), mesh = createSculptedPiece(cell.type, cell.color), pos = boardToWorld(f, r); mesh.position.set(pos.x, 0, pos.z); scene.add(mesh); pieceMeshes[sq] = mesh; } }
            clearHighlights(); updateHUD();
        }
        function clearHighlights() { while (highlightMeshes.length > 0) boardGroup.remove(highlightMeshes.pop()); }
        function showSquareHighlights(originSquare, moves) {
            clearHighlights();
            const originCoords = squareToCoords(originSquare);
            const selMesh = new THREE.Mesh(new THREE.RingGeometry(0.72, 0.92, 24), new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide })); selMesh.rotation.x = -Math.PI / 2; selMesh.position.set(originCoords.x, 0.03, originCoords.z); boardGroup.add(selMesh); highlightMeshes.push(selMesh);
            moves.forEach((m) => {
                const targetCoords = squareToCoords(m.to), isCapture = Boolean(m.captured);
                const marker = new THREE.Mesh(isCapture ? new THREE.RingGeometry(0.68, 0.96, 6) : new THREE.CircleGeometry(0.36, 20), new THREE.MeshBasicMaterial({ color: isCapture ? 0xf59e0b : 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.88 }));
                marker.rotation.x = -Math.PI / 2; marker.position.set(targetCoords.x, 0.035, targetCoords.z); marker.userData = { targetSquare: m.to }; boardGroup.add(marker); highlightMeshes.push(marker);
            });
        }
        function executeChessMove(moveObj) {
            if (isAnimating) return; isAnimating = true; clearHighlights(); selectedSquare = null;
            const result = game.move({ from: moveObj.from, to: moveObj.to, promotion: 'q' });
            if (!result) { isAnimating = false; return; }
            const attackerMesh = pieceMeshes[result.from], fromCoords = squareToCoords(result.from), toCoords = squareToCoords(result.to);
            let capturedSquare = result.to;
            if (result.flags.includes('e')) { const epRank = result.color === 'w' ? parseInt(result.to[1], 10) - 1 : parseInt(result.to[1], 10) + 1; capturedSquare = result.to[0] + epRank; }
            const defenderMesh = result.captured ? pieceMeshes[capturedSquare] : null;
            delete pieceMeshes[result.from]; if (defenderMesh && capturedSquare !== result.to) delete pieceMeshes[capturedSquare]; pieceMeshes[result.to] = attackerMesh;
            if (result.flags.includes('k') || result.flags.includes('q')) {
                const rankChar = result.color === 'w' ? '1' : '8', rookFrom = result.flags.includes('k') ? 'h' + rankChar : 'a' + rankChar, rookTo = result.flags.includes('k') ? 'f' + rankChar : 'd' + rankChar, rookMesh = pieceMeshes[rookFrom];
                if (rookMesh) { delete pieceMeshes[rookFrom]; pieceMeshes[rookTo] = rookMesh; const rPos = squareToCoords(rookTo); rookMesh.position.set(rPos.x, 0, rPos.z); }
            }
            const finishTurn = () => {
                if (result.flags.includes('p')) { scene.remove(attackerMesh); const queenMesh = createSculptedPiece('q', result.color); queenMesh.position.set(toCoords.x, 0, toCoords.z); scene.add(queenMesh); pieceMeshes[result.to] = queenMesh; }
                if (result.captured) capturedPieces[result.color === 'w' ? 'b' : 'w'].push(result.captured);
                isAnimating = false; updateHUD();
                if (!game.game_over() && vsAutomaton && game.turn() === 'b') setTimeout(() => triggerAutomatonMove(), 420);
            };
            if (defenderMesh) startKnockDownSequence({ attackerMesh, defenderMesh, fromPos: fromCoords, toPos: toCoords, onComplete: finishTurn });
            else { const isKnight = result.piece === 'n'; audioFX.playStoneSlide(isKnight ? 0.48 : 0.38); moveFlight = { mesh: attackerMesh, from: new THREE.Vector3(fromCoords.x, 0, fromCoords.z), to: new THREE.Vector3(toCoords.x, 0, toCoords.z), isKnight, elapsed: 0, duration: isKnight ? 0.46 : 0.36, onComplete: finishTurn }; }
        }
        function triggerAutomatonMove() {
            if (game.game_over() || isAnimating) return;
            const moves = game.moves({ verbose: true }); if (moves.length === 0) return;
            const pieceValues = { p: 10, n: 32, b: 33, r: 50, q: 90, k: 900 }, centerSquares = new Set(['d4', 'e4', 'd5', 'e5', 'c4', 'f4', 'c5', 'f5']);
            let bestScore = -Infinity, bestMoves = [];
            moves.forEach((m) => {
                let score = (Math.random() - 0.5) * 4;
                if (m.captured) score += pieceValues[m.captured] * 3.2 - pieceValues[m.piece] * 0.25;
                if (centerSquares.has(m.to)) score += 8;
                if (m.san.includes('+')) score += 12;
                if (score > bestScore) { bestScore = score; bestMoves = [m]; } else if (Math.abs(score - bestScore) < 1.5) bestMoves.push(m);
            });
            executeChessMove(bestMoves[Math.floor(Math.random() * bestMoves.length)] || moves[0]);
        }

        /* 7. DEMO KNOCK-DOWN */
        function triggerDemoKnockDownShowcase() {
            if (isAnimating || activeCombatSequence) return; isAnimating = true; clearHighlights(); selectedSquare = null;
            const attackerTypes = ['k', 'q', 'n', 'r'], defenderTypes = ['q', 'k', 'r', 'b'];
            const atkType = attackerTypes[Math.floor(Math.random() * attackerTypes.length)], defType = defenderTypes[Math.floor(Math.random() * defenderTypes.length)];
            const demoFrom = boardToWorld(3, 4), demoTo = boardToWorld(4, 3), hiddenReal = [];
            ['d4', 'e5'].forEach((sq) => { if (pieceMeshes[sq]) { pieceMeshes[sq].visible = false; hiddenReal.push(pieceMeshes[sq]); } });
            const demoAttacker = createSculptedPiece(atkType, 'w'); demoAttacker.position.set(demoFrom.x, 0, demoFrom.z); scene.add(demoAttacker);
            const demoDefender = createSculptedPiece(defType, 'b'); demoDefender.position.set(demoTo.x, 0, demoTo.z); scene.add(demoDefender);
            const prevRadius = camState.targetRadius; camState.targetRadius = 19.5;
            startKnockDownSequence({ attackerMesh: demoAttacker, defenderMesh: demoDefender, fromPos: demoFrom, toPos: demoTo, isDemo: true, onComplete: () => { setTimeout(() => { scene.remove(demoAttacker); hiddenReal.forEach((m) => { m.visible = true; }); camState.targetRadius = prevRadius; isAnimating = false; }, 520); } });
        }

        /* 8. HUD */
        function showCombatTelemetry(title, subtitle) { const el = document.getElementById('combat-telemetry'); document.getElementById('telemetry-title').textContent = title; document.getElementById('telemetry-subtitle').textContent = subtitle; el.classList.remove('opacity-0', '-translate-y-2'); el.classList.add('opacity-100', 'translate-y-0'); }
        function hideCombatTelemetry() { const el = document.getElementById('combat-telemetry'); el.classList.remove('opacity-100', 'translate-y-0'); el.classList.add('opacity-0', '-translate-y-2'); }
        function updateHUD() {
            const turn = game.turn(), turnDot = document.getElementById('turn-dot'), turnText = document.getElementById('turn-text'), subStatus = document.getElementById('game-substatus');
            if (turn === 'w') { turnDot.className = 'w-3 h-3 rounded-full bg-white shadow-[0_0_10px_#00f0ff]'; turnText.textContent = 'WHITE MARBLE TURN'; }
            else { turnDot.className = 'w-3 h-3 rounded-full bg-amber-500 shadow-[0_0_10px_#f59e0b]'; turnText.textContent = vsAutomaton ? 'AUTOMATON THINKING...' : 'DARK OBSIDIAN TURN'; }
            if (game.in_checkmate()) { const winner = turn === 'w' ? 'DARK OBSIDIAN' : 'WHITE MARBLE'; subStatus.textContent = `CHECKMATE • ${winner} TRIUMPHS`; showCombatTelemetry(`CHECKMATE — ${winner} VICTORY`, 'VBLOCKS CATHEDRAL GRANDMASTER'); }
            else if (game.in_draw() || game.in_stalemate()) subStatus.textContent = 'DRAW // CATHEDRAL STALEMATE';
            else if (game.in_check()) { subStatus.textContent = '⚠ KING UNDER ATTACK (CHECK)'; showCombatTelemetry('ROYAL CHECK DECLARED', 'DEFEND YOUR SOVEREIGN MONOLITH'); setTimeout(() => hideCombatTelemetry(), 1800); }
            else subStatus.textContent = 'VBLOCKS // IONITY-GLOBAL READY';
            document.getElementById('captured-black').innerHTML = capturedPieces.b.map((p) => `<span class="drop-shadow">${PIECE_SYMBOLS[p]}</span>`).join('');
            document.getElementById('captured-white').innerHTML = capturedPieces.w.map((p) => `<span class="drop-shadow">${PIECE_SYMBOLS[p]}</span>`).join('');
        }

        /* 9. INTERACTION */
        const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
        let isDragging = false, pointerDownPos = { x: 0, y: 0 }, prevPointer = { x: 0, y: 0 };
        function onPointerDown(e) { const clientX = e.touches ? e.touches[0].clientX : e.clientX, clientY = e.touches ? e.touches[0].clientY : e.clientY; isDragging = true; pointerDownPos = { x: clientX, y: clientY }; prevPointer = { x: clientX, y: clientY }; }
        function onPointerMove(e) {
            if (!isDragging) return; const clientX = e.touches ? e.touches[0].clientX : e.clientX, clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = clientX - prevPointer.x, dy = clientY - prevPointer.y; prevPointer = { x: clientX, y: clientY };
            camState.targetTheta -= dx * 0.0065; camState.targetPhi = Math.max(0.2, Math.min(1.38, camState.targetPhi - dy * 0.0055));
        }
        function onPointerUp(e) {
            if (!isDragging) return; isDragging = false;
            const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX, clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
            if (Math.hypot(clientX - pointerDownPos.x, clientY - pointerDownPos.y) < 8) handleBoardClick(clientX, clientY);
        }
        function handleBoardClick(clientX, clientY) {
            if (isAnimating || activeCombatSequence || game.game_over()) return; if (vsAutomaton && game.turn() === 'b') return;
            pointer.x = (clientX / window.innerWidth) * 2 - 1; pointer.y = -(clientY / window.innerHeight) * 2 + 1; raycaster.setFromCamera(pointer, camera);
            const pieceObjects = [];
            Object.entries(pieceMeshes).forEach(([sq, group]) => { group.traverse((child) => { if (child.isMesh) { child.userData.parentSquare = sq; pieceObjects.push(child); } }); });
            const hits = raycaster.intersectObjects([...tileMeshes, ...pieceObjects], false); if (hits.length === 0) return;
            const hitObj = hits[0].object, clickedSquare = hitObj.userData.square || hitObj.userData.parentSquare; if (!clickedSquare) return;
            if (selectedSquare) { const chosenMove = legalMovesForSelected.find((m) => m.to === clickedSquare); if (chosenMove) { executeChessMove(chosenMove); return; } }
            const pieceOnSq = game.get(clickedSquare);
            if (pieceOnSq && pieceOnSq.color === game.turn()) { selectedSquare = clickedSquare; legalMovesForSelected = game.moves({ square: clickedSquare, verbose: true }); audioFX.playSelect(); showSquareHighlights(clickedSquare, legalMovesForSelected); }
            else { selectedSquare = null; legalMovesForSelected = []; clearHighlights(); }
        }
        renderer.domElement.addEventListener('mousedown', onPointerDown); window.addEventListener('mousemove', onPointerMove); window.addEventListener('mouseup', onPointerUp);
        renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: true }); window.addEventListener('touchmove', onPointerMove, { passive: true }); window.addEventListener('touchend', onPointerUp, { passive: true });
        renderer.domElement.addEventListener('wheel', (e) => { camState.targetRadius = Math.max(14, Math.min(38, camState.targetRadius + e.deltaY * 0.015)); }, { passive: true });
        document.getElementById('btn-demo-knockdown').addEventListener('click', () => triggerDemoKnockDownShowcase());
        document.getElementById('btn-mode').addEventListener('click', () => { vsAutomaton = !vsAutomaton; document.getElementById('mode-label').textContent = vsAutomaton ? 'VS AUTOMATON' : '2P PASS & PLAY'; updateHUD(); if (vsAutomaton && game.turn() === 'b' && !isAnimating) triggerAutomatonMove(); });
        document.getElementById('btn-camera').addEventListener('click', () => { camState.presetIndex = (camState.presetIndex + 1) % CAMERA_PRESETS.length; const p = CAMERA_PRESETS[camState.presetIndex]; camState.targetTheta = p.theta; camState.targetPhi = p.phi; camState.targetRadius = p.radius; document.getElementById('camera-label').textContent = p.name; });
        document.getElementById('btn-undo').addEventListener('click', () => { if (isAnimating || activeCombatSequence) return; game.undo(); if (vsAutomaton && game.turn() === 'b') game.undo(); capturedPieces.w.pop(); capturedPieces.b.pop(); syncBoardFromChessState(); });
        document.getElementById('btn-audio').addEventListener('click', () => { const on = audioFX.toggle(); document.getElementById('icon-audio-on').classList.toggle('hidden', !on); document.getElementById('icon-audio-off').classList.toggle('hidden', on); });
        document.getElementById('btn-reset').addEventListener('click', () => { if (activeCombatSequence) activeCombatSequence = null; isAnimating = false; game.reset(); capturedPieces.w = []; capturedPieces.b = []; syncBoardFromChessState(); });
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

        /* 10. DUST & LOOP */
        let dustSystem = null;
        function createCathedralDustMotes() {
            const count = 220, geo = new THREE.BufferGeometry(), positions = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) { positions[i * 3] = (Math.random() - 0.5) * 44; positions[i * 3 + 1] = Math.random() * 24; positions[i * 3 + 2] = (Math.random() - 0.5) * 44; }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            dustSystem = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.14, transparent: true, opacity: 0.55 })); scene.add(dustSystem);
        }
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05), elapsed = clock.getElapsedTime();
            if (moveFlight) {
                moveFlight.elapsed += dt; const t = Math.min(moveFlight.elapsed / moveFlight.duration, 1), smooth = t * t * (3 - 2 * t);
                moveFlight.mesh.position.lerpVectors(moveFlight.from, moveFlight.to, smooth);
                if (moveFlight.isKnight) { moveFlight.mesh.position.y = Math.sin(t * Math.PI) * 2.8; moveFlight.mesh.userData.bodyPivot.rotation.x = Math.sin(t * Math.PI * 2) * 0.25; }
                if (t >= 1) { moveFlight.mesh.position.copy(moveFlight.to); moveFlight.mesh.position.y = 0; moveFlight.mesh.userData.bodyPivot.rotation.x = 0; const cb = moveFlight.onComplete; moveFlight = null; if (cb) cb(); }
            }
            updateCombatAndPhysics(dt);
            Object.values(pieceMeshes).forEach((piece) => {
                if (activeCombatSequence && (piece === activeCombatSequence.attackerMesh || piece === activeCombatSequence.defenderMesh)) return;
                const phase = piece.userData.idlePhase; piece.userData.bodyPivot.position.y = Math.sin(elapsed * 2.1 + phase) * 0.035;
                const queenCrystal = piece.getObjectByName('queenCrystal'); if (queenCrystal) { queenCrystal.rotation.y = elapsed * 2.4; queenCrystal.position.y = 2.58 + Math.sin(elapsed * 3.2 + phase) * 0.07; }
            });
            holoRings.forEach((h, i) => { h.rotation.y = elapsed * 1.15 + i; h.position.y = 4.9 + Math.sin(elapsed * 2.0 + i) * 0.16; });
            brazierLights.forEach((b) => { b.light.intensity = b.baseIntensity + Math.sin(elapsed * 7.5 + b.phase) * 0.18; });
            if (dustSystem) dustSystem.rotation.y = elapsed * 0.02;
            camState.theta += (camState.targetTheta - camState.theta) * 0.09; camState.phi += (camState.targetPhi - camState.phi) * 0.09; camState.radius += (camState.targetRadius - camState.radius) * 0.09;
            camera.position.set(camState.radius * Math.sin(camState.phi) * Math.sin(camState.theta), camState.radius * Math.cos(camState.phi), camState.radius * Math.sin(camState.phi) * Math.cos(camState.theta));
            if (camState.shakeIntensity > 0.005) { camera.position.x += (Math.random() - 0.5) * camState.shakeIntensity; camera.position.y += (Math.random() - 0.5) * camState.shakeIntensity; camera.position.z += (Math.random() - 0.5) * camState.shakeIntensity; camState.shakeIntensity *= 0.86; } else camState.shakeIntensity = 0;
            camera.lookAt(camState.lookAt); renderer.render(scene, camera);
        }
        window.onload = function () { buildGothicCathedralAndBranding(); buildChessboard(); createCathedralDustMotes(); syncBoardFromChessState(); animate(); };
    </script>
